function cartIds(){ return [...cart.keys()].filter(id => products.some(p => p.id === id)); }
function cartTotal(){ return cartIds().reduce((sum,id)=> sum + products.find(x=>x.id===id).price * cart.get(id), 0); }

// Предмет заявки в режиме «inquiry» — живёт отдельно от корзины, чтобы
// оформление одного товара не стирало то, что покупатель уже набрал.
let inquiryItem = null;
function orderItems(){
  if(inquiryItem && products.some(p => p.id === inquiryItem)) return [{ id: inquiryItem, qty: 1 }];
  return cartIds().map(id => ({ id, qty: cart.get(id) }));
}
function orderTotal(){
  return orderItems().reduce((sum, i) => {
    const p = products.find(x => x.id === i.id);
    return sum + (p ? p.price * i.qty : 0);
  }, 0);
}

function renderCart(){
  if(!settings) return; // в превью настройки приходят асинхронно из админки
  const ids = cartIds();
  const list = document.getElementById('cartList');
  const footer = document.getElementById('cartFooter');
  if(!ids.length){
    list.innerHTML = `<div class="empty">Здесь пока пусто.\nНажмите «+» на товаре, чтобы добавить его сюда.<div class="empty-action" id="cartToCatalog">Перейти к товарам</div></div>`;
    footer.innerHTML = '';
    const back = document.getElementById('cartToCatalog');
    if(back) back.onclick = () => closeSheet('cartOverlay');
    return;
  }
  list.innerHTML = ids.map(id=>{
    const p = products.find(x=>x.id===id);
    const qty = cart.get(id);
    const maxed = typeof p.stock === 'number' && qty >= p.stock;
    // сумма по строке, а не только цена за штуку: при qty>1 покупатель иначе
    // считает в уме, а на кассе удивляется итогу
    const lineTotal = p.price * qty;
    return `
    <div class="cart-row">
      <div class="fav-thumb">${thumbHTML(p)}</div>
      <div class="fav-info">
        <div class="fav-name">${esc(p.name)}</div>
        <div class="fav-price">${settings.commerce.priceHidden ? esc(settings.commerce.priceHiddenText) : fmt(lineTotal)}${qty > 1 ? `<span class="per-unit">${fmt(p.price)} × ${qty}</span>` : ''}</div>
      </div>
      <div class="cart-controls">
        <div class="qty">
          <button class="tap44" data-id="${id}" data-op="-" aria-label="Убрать одну штуку">−</button>
          <span aria-live="polite">${qty}</span>
          <button class="tap44" data-id="${id}" data-op="+" ${maxed ? 'disabled' : ''} aria-label="Добавить ещё одну">+</button>
        </div>
        <button class="cart-remove tap44" data-remove="${id}" aria-label="Удалить «${esc(p.name)}» из корзины" title="Удалить">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6h16z"/></svg>
        </button>
      </div>
    </div>`;
  }).join('');

  const total = cartTotal();
  const m = settings.commerce;
  const below = m.minOrder && total < m.minOrder;
  footer.innerHTML = `
    <div class="cart-total"><span>Итого</span><span>${m.priceHidden ? '—' : fmt(total)}</span></div>
    ${below ? `<div class="banner" style="margin:0 0 12px">До минимального заказа не хватает ${fmt(m.minOrder - total)}</div>` : ''}
    ${settings.manager.buyUrl ? `<button class="secondary-btn" id="cartMessageBtn" style="margin:0 0 10px">Написать менеджеру</button>` : ''}
    ${m.mode === 'cart' && !hasNativeMainButton() ? `<button class="checkout-btn" id="checkoutBtn" ${below ? 'disabled' : ''}>${esc(m.ctaCart || 'Оформить заказ')}</button>` : ''}
  `;
  list.querySelectorAll('.qty button').forEach(btn=>{
    btn.onclick = () => changeQty(Number(btn.dataset.id), btn.dataset.op);
  });
  list.querySelectorAll('[data-remove]').forEach(btn=>{
    btn.onclick = () => removeFromCart(Number(btn.dataset.remove));
  });
  const msgBtn = document.getElementById('cartMessageBtn');
  if(msgBtn) msgBtn.onclick = messageManagerFromCart;
  const coBtn = document.getElementById('checkoutBtn');
  if(coBtn) coBtn.onclick = openCheckoutForm;
}

// Удаление одной кнопкой + отмена. Раньше убрать товар можно было только
// многократным нажатием «−» до нуля — на пяти штуках это пять тапов вслепую.
let lastRemoved = null;
function removeFromCart(id){
  const p = products.find(x => x.id === id);
  lastRemoved = { id, qty: cart.get(id) };
  cart.delete(id);
  haptic.press();
  updateCartUI();
  showToast(`«${p ? p.name : 'Товар'}» убран`, false, { label: 'Вернуть', onClick: undoRemove });
}
function undoRemove(){
  if(!lastRemoved) return;
  cart.set(lastRemoved.id, lastRemoved.qty);
  lastRemoved = null;
  haptic.tap();
  updateCartUI();
}

function addToCart(id){
  const p = products.find(x => x.id === id);
  const current = cart.get(id) || 0;
  if(p && typeof p.stock === 'number' && current >= p.stock){ haptic.err(); showToast('Больше нет в наличии'); return; }
  cart.set(id, current + 1);
  haptic.tap();
  showToast(`«${p.name}» в корзине`);
  updateCartUI();
}
function changeQty(id, op){
  const p = products.find(x => x.id === id);
  if(op === '+' && p && typeof p.stock === 'number' && cart.get(id) >= p.stock){ haptic.err(); return; }
  const next = cart.get(id) + (op==='+' ? 1 : -1);
  next <= 0 ? cart.delete(id) : cart.set(id, next);
  haptic.tap();
  updateCartUI();
}
function pulse(el){
  el.classList.remove('pulse');
  void el.offsetWidth; // форсируем reflow, чтобы анимация сыграла заново
  el.classList.add('pulse');
}

function updateCartUI(){
  // Считаем только те позиции, что реально есть в каталоге. Иначе после
  // удаления товара продавцом у покупателя навсегда оставался бы бейдж
  // «7 товаров» при итоге за две штуки — корзина восстанавливается из
  // localStorage и про удалённые id ничего не знает.
  const count = cartIds().reduce((a, id) => a + (cart.get(id) || 0), 0);
  const badge = document.getElementById('cartCount');
  badge.style.display = count ? 'flex' : 'none';
  badge.textContent = count;
  if(count) pulse(badge);
  renderCart();
  saveState();
  syncMainButton();
}

// --- MainButton: нативная кнопка Telegram вместо самодельной там, где она уместна ---
// setParams в SDK не предупреждает, а БРОСАЕТ WebAppMainButtonParamInvalid на
// некорректном цвете или пустом тексте — а цвет у нас задаёт продавец в админке
// и может прийти чем угодно (rgb(), название, свой CSS). Поэтому фильтруем.
const HEX_RE = /^#([0-9a-f]{3}|[0-9a-f]{6})$/i;
function themeHex(varName){
  const v = getComputedStyle(document.documentElement).getPropertyValue(varName).trim();
  if(!v) return undefined;
  if(HEX_RE.test(v)) return v;
  // Продавец мог вписать rgb() или название цвета, а setHeaderColor /
  // setBackgroundColor / MainButton принимают только hex. Раньше в этом случае
  // шапка уезжала на ключевое слово 'bg_color' — а это ЦВЕТ ИЗ ТЕМЫ КЛИЕНТА,
  // у покупателя со светлым Telegram шапка и фон становились белыми.
  // Разрешаем любой CSS-цвет в hex через скрытый элемент.
  const probe = document.createElement('i');
  probe.style.cssText = 'position:absolute;visibility:hidden;color:' + v;
  document.documentElement.appendChild(probe);
  const rgb = (getComputedStyle(probe).color.match(/[\d.]+/g) || []).map(Number);
  probe.remove();
  if(rgb.length < 3) return undefined;
  return '#' + rgb.slice(0, 3).map(x => Math.min(255, Math.max(0, Math.round(x))).toString(16).padStart(2, '0')).join('');
}
// Нативная MainButton есть только внутри настоящего клиента Telegram. В обычном
// браузере объект тоже существует, но кнопка не отрисовывается — там нужна своя.
// От этого зависит, рисовать ли кнопку в шторке: иначе выходит две «Оформить заказ»
// разом, одна поверх другой.
// Если setParams один раз бросил исключение, нативной кнопке доверять нельзя:
// дальше считаем, что её нет, и рисуем свою в шторке. Без этого флага корзина
// оставалась вообще без кнопки оформления — нативная не отрисовалась, а свою
// не рисовали именно потому, что нативная «есть».
let mainButtonBroken = false;
function hasNativeMainButton(){
  return !mainButtonBroken && !!(tg && tg.MainButton && tg.platform && tg.platform !== 'unknown');
}

function syncMainButton(){
  const mb = tg?.MainButton;
  if(!mb || !settings || !hasNativeMainButton()) return;
  const cartOpen = document.getElementById('cartOverlay').classList.contains('open');
  const total = cartTotal();
  if(cartOpen && cartIds().length && settings.commerce.mode === 'cart'){
    const label = `${settings.commerce.ctaCart || 'Оформить заказ'}${settings.commerce.priceHidden ? '' : ' · ' + fmt(total)}`;
    try{
      mb.setParams({
        text: label.slice(0, 64) || 'Оформить заказ', // лимит Telegram — 64 символа
        color: themeHex('--accent'),
        // именно --on-accent, а не --text: цвет считается ПОД акцентной заливкой
        // кнопки. С белым акцентом (пресет ERD) и почти белым текстом надпись
        // на нативной кнопке пропадала — та же беда, что чинили у своих кнопок.
        text_color: themeHex('--on-accent'),
        is_active: !(settings.commerce.minOrder && total < settings.commerce.minOrder),
        is_visible: true,
      });
      mb.offClick(onMainButton); mb.onClick(onMainButton);
    }catch(e){
      // Нативная кнопка не поднялась — навсегда переключаемся на свою и
      // перерисовываем корзину, иначе покупателю нечем оформить заказ.
      console.warn('[MainButton] не удалось настроить, переключаюсь на кнопку в шторке:', e.message);
      mainButtonBroken = true;
      mb.hide();
      renderCart();
    }
  } else {
    mb.hide();
  }
}
function onMainButton(){ haptic.press(); openCheckoutForm(); }

let settingsLoaded = false;

function openBuyLink(rawUrl, text){
  let url = normalizeLink(rawUrl);
  let finalUrl = url;
  let isTelegramLink = false;
  try{
    const u = new URL(url);
    isTelegramLink = (u.hostname === 't.me' || u.hostname === 'telegram.me');
    if((isTelegramLink || u.hostname === 'wa.me') && text){
      // Собираем query вручную. searchParams.set() сериализует по правилам
      // form-urlencoded и превращает пробелы в «+»; Telegram разбирает
      // draft_text как обычную percent-строку и показывает плюсы буквально —
      // из-за этого черновик выглядел пустым или ломаным. encodeURIComponent
      // даёт %20, который понимают и Telegram, и WhatsApp.
      const base = u.origin + u.pathname;
      finalUrl = `${base}?text=${encodeURIComponent(text)}`;
    }
  }catch(e){}

  const proceed = () => {
    // t.me-ссылки обязаны идти через openTelegramLink — это переключает на чат
    // внутри самого Telegram. openLink для них открывает встроенный браузер
    // с рендером страницы t.me, а не сам чат.
    if(isTelegramLink && tg?.openTelegramLink) tg.openTelegramLink(finalUrl);
    else if(tg?.openLink) tg.openLink(finalUrl);
    else window.open(finalUrl, '_blank');
  };

  // ?text= в t.me-ссылках подставляется нестабильно на мобильных клиентах —
  // подстраховываемся копированием в буфер, чтобы текст можно было вставить
  if(text && settings?.manager.autoCopy && navigator.clipboard?.writeText){
    navigator.clipboard.writeText(text)
      .then(() => { showToast('Текст скопирован — вставьте его в чат'); setTimeout(proceed, 700); })
      .catch(proceed);
  } else proceed();
}

// action = { label, onClick } — необязательная кнопка прямо в уведомлении,
// нужна для «Вернуть» после удаления из корзины.
function showToast(msg, isError, action){
  document.querySelectorAll('.toast').forEach(t => t.remove()); // не копим стопку
  const el = document.createElement('div');
  el.className = 'toast' + (isError ? ' err' : '');
  el.textContent = msg;
  if(action){
    const btn = document.createElement('button');
    btn.className = 'toast-action';
    btn.textContent = action.label;
    btn.onclick = () => { action.onClick(); el.remove(); };
    el.appendChild(btn);
  }
  document.body.appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  const life = action ? 5000 : (isError ? 3600 : 2400);
  setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 300); }, life);
}

function notifyInquiry(subject){
  fetch('/api/inquiry', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ initData: tg?.initData || '', subject }),
  }).catch(()=>{});
}

function messageManagerFromCart(){
  const ids = cartIds();
  if(!ids.length) return;
  const lines = ids.map(id => {
    const p = products.find(x=>x.id===id);
    return `${p.name} × ${cart.get(id)} — ${fmt(p.price * cart.get(id))}`;
  });
  const text = fillTemplate(settings.manager.templateCart, {
    items: lines.join('\n'), total: fmt(cartTotal()), shop: settings.brand.shopName, name: user.first_name || '',
  });
  haptic.press();
  notifyInquiry(`Корзина:\n${lines.join('\n')}\nИтого: ${fmt(cartTotal())}`);
  openBuyLink(settings.manager.buyUrl, text);
}

function quickBuy(p){
  const m = settings.commerce;
  haptic.press();

  if(m.mode === 'manager' || (m.mode === 'cart' && !m.enableCart)){
    if(!settings.manager.buyUrl){ showToast('Контакт менеджера не настроен', true); haptic.err(); return; }
    const text = fillTemplate(settings.manager.templateProduct, {
      product: p.name, price: m.priceHidden ? m.priceHiddenText : fmt(p.price),
      shop: settings.brand.shopName, name: user.first_name || '',
    });
    notifyInquiry(`Товар: ${p.name} — ${fmt(p.price)}`);
    openBuyLink(settings.manager.buyUrl, text);
    return;
  }

  if(m.mode === 'inquiry'){
    // Раньше здесь делался cart.clear() — заявка по одному товару стирала всё,
    // что покупатель успел набрать. Держим предмет заявки отдельно от корзины.
    inquiryItem = p.id;
    coDraft = null;
    renderCheckoutForm();
    closeSheet('detailOverlay');
    openSheet('checkoutOverlay');
    return;
  }

  addToCart(p.id);
  closeSheet('detailOverlay');
  openCheckoutForm();
}

// Черновик формы: значения живут в объекте, а не только в DOM, поэтому
// перерисовка (например, после применения промокода) не стирает то, что
// покупатель уже успел набрать.
let coDraft = null;
function freshDraft(){
  const c = settings.checkout;
  return {
    name: user.first_name || '', phone: '', email: '',
    payment: (c.paymentMethods||[])[0] || '',
    delivery: (c.deliveryMethods||[])[0] || '',
    address: '', comment: '', agree: false,
    promo: appliedPromo ? appliedPromo.code : '',
  };
}

function coField(label, inputHtml){
  return `<div class="field"><label>${label}</label>${inputHtml}<div class="field-error"></div></div>`;
}

function coOptions(key, options, current){
  return `<div class="co-options" role="radiogroup">` + options.map(o => {
    const on = o === current;
    return `<button type="button" role="radio" aria-checked="${on}" class="co-option${on ? ' selected' : ''}" data-co="${key}" data-v="${esc(o)}">${esc(o)}</button>`;
  }).join('') + `</div>`;
}

function coGroup(title, inner){
  return inner ? `<div class="co-group"><div class="co-group-title">${title}</div>${inner}</div>` : '';
}

function openCheckoutForm(){
  inquiryItem = null; // вход из корзины — оформляем именно корзину, а не заявку
  if(!cartIds().length) return;
  coDraft = null;     // новое оформление — чистый черновик
  renderCheckoutForm();
  // Корзину закрываем: две шторки одновременно накладывались друг на друга —
  // форма заказа открывалась поверх, а корзина продолжала просвечивать сзади.
  closeSheet('cartOverlay');
  openSheet('checkoutOverlay');
}

function renderCheckoutForm(){
  const c = settings.checkout;
  if(!coDraft) coDraft = freshDraft();
  const hasDelivery = (c.deliveryMethods||[]).length > 0;

  const contacts = [
    c.askName ? coField('Имя', `<input id="coName" value="${esc(coDraft.name)}" placeholder="Как к вам обращаться" autocomplete="name">`) : '',
    c.askPhone ? coField(`Телефон${c.phoneRequired ? ' *' : ''}`, `<input id="coPhone" type="tel" inputmode="tel" placeholder="+7 900 123-45-67" value="${esc(coDraft.phone)}" autocomplete="tel">`) : '',
    c.askEmail ? coField('Email', `<input id="coEmail" type="email" inputmode="email" placeholder="mail@example.com" value="${esc(coDraft.email)}" autocomplete="email">`) : '',
  ].join('');

  const delivery = [
    hasDelivery ? coField('Способ доставки', coOptions('delivery', c.deliveryMethods, coDraft.delivery)) : '',
    hasDelivery && c.askAddress ? coField('Адрес доставки', `<textarea id="coAddress" placeholder="Город, улица, дом, квартира">${esc(coDraft.address)}</textarea>`) : '',
  ].join('');

  const payment = (c.paymentMethods||[]).length
    ? coField('Способ оплаты', coOptions('payment', c.paymentMethods, coDraft.payment)) : '';

  const details = [
    c.askComment ? coField('Комментарий', `<textarea id="coComment" placeholder="Пожелания к заказу">${esc(coDraft.comment)}</textarea>`) : '',
    settings.promo && settings.promo.enabled ? `
      <div class="field promo-field">
        <label>${esc(settings.promo.label || 'Промокод')}</label>
        <div class="promo-row">
          <input id="coPromo" placeholder="Введите код" autocomplete="off" autocapitalize="characters" value="${esc(coDraft.promo)}">
          <button type="button" class="secondary-btn promo-apply" id="coPromoBtn">${appliedPromo ? 'Убрать' : 'Применить'}</button>
        </div>
        <div class="promo-msg" id="coPromoMsg">${appliedPromo ? `Скидка ${esc(appliedPromo.label)} — минус ${fmt(appliedPromo.discount)}` : ''}</div>
      </div>` : '',
    c.requireAgreement ? `<label class="check-row"><input type="checkbox" id="coAgree" ${coDraft.agree ? 'checked' : ''}><span>${esc(c.agreementText)}</span></label>` : '',
  ].join('');

  document.getElementById('checkoutBody').innerHTML = `
    <div class="sheet-title">Оформление заказа</div>
    ${coGroup('Контакты', contacts)}
    ${coGroup('Доставка', delivery)}
    ${coGroup('Оплата', payment)}
    ${coGroup('Детали', details)}
    ${appliedPromo ? `<div class="cart-total" style="border:none;padding:0 4px 6px;font-size:calc(14px * var(--fs))"><span style="color:var(--muted)">Сумма</span><span style="color:var(--muted)">${fmt(orderTotal())}</span></div>` : ''}
    <div class="cart-total" style="border:none;padding-top:0"><span>К оплате</span><span>${settings.commerce.priceHidden ? '—' : fmt(payableTotal())}</span></div>
    <button class="checkout-btn" id="coSubmitBtn">Подтвердить заказ</button>
  `;
  document.getElementById('coSubmitBtn').onclick = submitOrder;
  const promoBtn = document.getElementById('coPromoBtn');
  if(promoBtn) promoBtn.onclick = togglePromo;
}

// Делегирование событий формы на контейнере: обработчики не переподписываются
// после каждой перерисовки (переключатели, ввод, галочка согласия).
document.getElementById('checkoutBody').addEventListener('click', e => {
  const opt = e.target.closest('.co-option');
  if(!opt || !coDraft) return;
  coDraft[opt.dataset.co] = opt.dataset.v;
  haptic.tap();
  renderCheckoutForm();
});
document.getElementById('checkoutBody').addEventListener('input', e => {
  if(!coDraft) return;
  const map = { coName:'name', coPhone:'phone', coEmail:'email', coAddress:'address', coComment:'comment', coPromo:'promo' };
  const k = map[e.target.id];
  if(!k) return;
  coDraft[k] = e.target.value;
  // ошибка снимается сразу, как только поле начали исправлять
  const fld = e.target.closest('.field');
  if(fld && fld.classList.contains('invalid')) fld.classList.remove('invalid');
});
document.getElementById('checkoutBody').addEventListener('change', e => {
  if(coDraft && e.target.id === 'coAgree') coDraft.agree = e.target.checked;
});

// --- промокод ---
// Скидку считает сервер и только он: на клиенте её было бы тривиально подделать,
// поэтому здесь мы храним лишь то, что сервер уже подтвердил.
let appliedPromo = null;
function payableTotal(){
  return Math.max(0, orderTotal() - (appliedPromo ? appliedPromo.discount : 0));
}

async function togglePromo(){
  const input = document.getElementById('coPromo');
  const msg = document.getElementById('coPromoMsg');
  const btn = document.getElementById('coPromoBtn');

  if(appliedPromo){                 // кнопка работает как «Убрать»
    appliedPromo = null;
    renderCheckoutForm();
    haptic.tap();
    return;
  }

  const code = input.value.trim();
  if(!code){ input.focus(); return; }

  btn.disabled = true;
  msg.className = 'promo-msg';
  msg.textContent = 'Проверяем…';
  try{
    const res = await fetch('/api/promo/check', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ code, items: orderItems() }),
    });
    const data = await res.json();
    if(!data.ok) throw new Error(data.error || 'Промокод не найден');
    appliedPromo = { code: data.code, discount: data.discount, label: data.label };
    haptic.ok();
    renderCheckoutForm();           // перерисовываем — обновится и «К оплате»
  }catch(e){
    haptic.err();
    msg.className = 'promo-msg err';
    msg.textContent = e.message;
    btn.disabled = false;
  }
}

function setFieldError(id, msg){
  const el = document.getElementById(id);
  if(!el) return;
  const fld = el.closest('.field');
  fld.classList.add('invalid');
  fld.querySelector('.field-error').textContent = msg;
}

async function submitOrder(){
  const c = settings.checkout;
  const btn = document.getElementById('coSubmitBtn');
  const d = coDraft || freshDraft();

  // валидация до отправки: подсвечиваем конкретное поле и пишем, что не так
  if(c.askPhone){
    const digits = d.phone.replace(/\D/g, '');
    if(c.phoneRequired && digits.length < 10){
      haptic.err(); setFieldError('coPhone', 'Укажите номер полностью — минимум 10 цифр');
      document.getElementById('coPhone')?.focus();
      return;
    }
    if(!c.phoneRequired && digits && digits.length < 10){
      haptic.err(); setFieldError('coPhone', 'Номер выглядит неполным — проверьте цифры');
      document.getElementById('coPhone')?.focus();
      return;
    }
  }
  if(c.askEmail && d.email.trim() && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.email.trim())){
    haptic.err(); setFieldError('coEmail', 'Проверьте адрес почты — например, mail@example.com');
    document.getElementById('coEmail')?.focus();
    return;
  }
  if(c.requireAgreement && !d.agree){
    haptic.err(); showToast('Нужно согласие на обработку данных', true); return;
  }

  btn.disabled = true;
  btn.textContent = 'Отправляем…';

  const items = orderItems(); // корзина либо один товар-заявка
  // Состав для экрана успеха снимаем до очистки корзины
  const summary = items.map(i => {
    const p = products.find(x => x.id === Number(i.id));
    return p ? { name: p.name, qty: i.qty, sum: p.price * i.qty } : null;
  }).filter(Boolean);
  const customer = {
    name: d.name.trim() || user.first_name || 'Без имени',
    phone: d.phone.trim(), email: d.email.trim(),
    payment: d.payment, delivery: d.delivery,
    address: d.address.trim(), comment: d.comment.trim(),
  };

  try{
    const res = await fetch('/api/checkout', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      // код шлём, а не готовую скидку: сервер пересчитает сам
      body: JSON.stringify({ initData: tg?.initData || '', items, customer,
        promoCode: appliedPromo ? appliedPromo.code : '' }),
    });
    const data = await res.json();
    if(!res.ok || !data.ok) throw new Error(data.error || 'Не удалось отправить заказ');
    haptic.ok();
    showCheckoutSuccess(data, summary);
    // заявка по одному товару корзину не трогает — чистим только то, что отправили
    if(inquiryItem) inquiryItem = null; else cart.clear();
    appliedPromo = null; // код израсходован, на следующий заказ не переносится
    updateCartUI();
    loadProducts(); // остатки на сервере уменьшились — подтягиваем актуальные
  }catch(e){
    haptic.err();
    btn.disabled = false;
    btn.textContent = 'Подтвердить заказ';
    showToast(e.message || 'Не удалось отправить — попробуйте ещё раз', true);
  }
}

// Экран успеха только для покупателя: номер, состав и сумма заказа, следующий
// шаг. Служебная карточка заказа (buildOrderText) уходит исключительно
// менеджеру — здесь она не показывается, доступна лишь через «Скопировать».
function showCheckoutSuccess(data, summary){
  const c = settings.checkout;
  const pay = settings.payments || {};
  const rows = summary.map(i =>
    `<div class="co-row"><span>${esc(i.name)} × ${i.qty}</span><span>${fmt(i.sum)}</span></div>`).join('');
  const total = data.total != null ? data.total : payableTotal();
  document.getElementById('checkoutBody').innerHTML = `
    <div class="co-success">
      <div class="co-check" aria-hidden="true"><svg viewBox="0 0 52 52" fill="none"><path d="M14 27l8 8 16-17" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div class="sheet-title">${esc(c.successTitle)}</div>
      <div class="co-orderno">Заказ № ${esc(String(data.orderId))}</div>
      ${rows ? `<div class="co-summary">${rows}<div class="co-row co-total-row"><span>К оплате</span><span>${settings.commerce.priceHidden ? '—' : fmt(total)}</span></div></div>` : ''}
      <div class="co-next">${esc(c.successText)}</div>
      ${pay.enabled && data.orderId ? `<button class="checkout-btn" id="coPayBtn" style="margin-bottom:10px">${esc(pay.buttonText || 'Оплатить онлайн')}</button>` : ''}
      <button class="${pay.enabled && data.orderId ? 'secondary-btn' : 'checkout-btn'}" id="coDoneBtn" style="margin-bottom:10px">Вернуться в магазин</button>
      ${settings.manager.buyUrl ? `<button class="secondary-btn" id="coWriteBtn" style="margin-bottom:10px">Написать менеджеру</button>` : ''}
      <button class="secondary-btn co-copy" id="coCopyBtn">Скопировать заказ</button>
    </div>
  `;
  const payBtn = document.getElementById('coPayBtn');
  if(payBtn) payBtn.onclick = () => startPayment(data.orderId, payBtn);
  document.getElementById('coDoneBtn').onclick = () => closeSheet('checkoutOverlay');
  const w = document.getElementById('coWriteBtn');
  if(w) w.onclick = () => openBuyLink(settings.manager.buyUrl, data.orderText);
  document.getElementById('coCopyBtn').onclick = () => {
    navigator.clipboard?.writeText(data.orderText).then(()=> { haptic.ok(); showToast('Скопировано'); }).catch(()=>{});
  };
}

// Онлайн-оплата: сервер сам считает сумму по сохранённому заказу и возвращает
// ссылку мерчанта. Открываем её через openLink, чтобы платёжная страница
// не рисовалась внутри мини-аппа — там часто ломается 3-D Secure.
async function startPayment(orderId, btn){
  btn.disabled = true;
  const original = btn.textContent;
  btn.textContent = 'Готовим оплату…';
  try{
    const res = await fetch('/api/pay', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ orderId }),
    });
    const data = await res.json();
    if(!res.ok || !data.ok) throw new Error(data.error || 'Не удалось создать платёж');
    haptic.ok();
    if(tg?.openLink) tg.openLink(data.url); else window.open(data.url, '_blank');
    btn.textContent = 'Открыть оплату ещё раз';
    btn.disabled = false;
  }catch(e){
    haptic.err();
    showToast(e.message, true);
    btn.textContent = original;
    btn.disabled = false;
  }
}

function updateFavUI(){
  const n = [...favorites].filter(id => products.some(p => p.id === id)).length;
  const badge = document.getElementById('favCount');
  badge.style.display = n ? 'flex' : 'none';
  badge.textContent = n;
  if(n) pulse(badge);

function toggleFav(id){
  favorites.has(id) ? favorites.delete(id) : favorites.add(id);
  haptic.tap();
  // Точечно перекрашиваем одно сердечко вместо перерисовки всей сетки:
  // полный renderGrid перезапускал анимацию появления у всех карточек, и лайк
  // выглядел как «страница моргнула».
  const on = favorites.has(id);
  const btn = document.querySelector(`.card-fav[data-id="${id}"]`);
  if(btn){
    btn.classList.toggle('active', on);
    btn.querySelector('svg').setAttribute('fill', on ? 'currentColor' : 'none');
    btn.setAttribute('aria-pressed', on ? 'true' : 'false');
  }
  updateFavUI();
}

// --- overlays + нативная BackButton ---
const sheetStack = [];
// Шторки не накладываются друг на друга НИКОГДА: они все position:fixed с одним
// z-index, и вторая просто просвечивает сквозь первую. Ни один сценарий в
// приложении не требует двух открытых шторок разом, поэтому открытие новой
// закрывает предыдущую — это чинит весь класс бага, а не отдельные переходы
// (корзина → заказ, профиль → избранное и любые будущие).
function openSheet(id){
  document.querySelectorAll('.overlay.open').forEach(ov => {
    if(ov.id !== id) closeSheet(ov.id);
  });
  document.getElementById(id).classList.add('open');
  if(!sheetStack.includes(id)) sheetStack.push(id);
  syncBackButton();
  syncMainButton();
}
function closeSheet(id){
  document.getElementById(id).classList.remove('open');
  const i = sheetStack.indexOf(id);
  if(i !== -1) sheetStack.splice(i, 1);
  syncBackButton();
  syncMainButton();
}
function closeTopSheet(){
  const top = sheetStack[sheetStack.length - 1];
  if(!top) return;
  haptic.tap();
  // лайтбокс — не .overlay, у него своя механика показа
  if(top === 'lightbox') closeLightbox(); else closeSheet(top);
}
// BackButton Telegram вместо кастомной «назад»: аппаратная кнопка Android и
// свайп-назад на iOS ведут себя ожидаемо только через неё.
function syncBackButton(){
  const bb = tg?.BackButton;
  if(!bb) return;
  if(sheetStack.length){ bb.show(); } else { bb.hide(); }
}
// Подписываемся двумя способами намеренно, и это безопасно:
//   * BackButton.onClick внутри SDK гейтится по версии (Bot API 6.1+) и на
//     старых клиентах молча не регистрирует ничего;
//   * onEvent('backButtonClicked') работает без проверки версии.
// Дублирования не будет: SDK хранит обработчики массивом и отсеивает повторную
// подписку той же ссылки через indexOf — проверено на реальном telegram-web-app.js.
tg?.BackButton?.onClick(closeTopSheet);
tg?.onEvent('backButtonClicked', closeTopSheet);

// Автоскрытие кнопки корзины при прокрутке вниз. Порог 6px гасит дрожание
// пальца, а таймер возвращает кнопку на месте — иначе она оставалась бы
// спрятанной, если покупатель остановился, не начав листать обратно.
(function autoHideFab(){
  const fab = document.getElementById('cartBtn');
  let last = window.scrollY, idleT;
  window.addEventListener('scroll', () => {
    const y = window.scrollY;
    const dy = y - last;
    if(Math.abs(dy) > 6){
      fab.classList.toggle('hidden', dy > 0 && y > 120);
      last = y;
    }
    clearTimeout(idleT);
    idleT = setTimeout(() => fab.classList.remove('hidden'), 550);
  }, { passive: true });
})();

document.getElementById('profileBtn').onclick = () => { haptic.tap(); openSheet('profileOverlay'); };
document.getElementById('favBtn').onclick = () => { haptic.tap(); openSheet('favOverlay'); };
document.getElementById('cartBtn').onclick = () => { haptic.tap(); openSheet('cartOverlay'); };
document.querySelectorAll('.overlay').forEach(ov=>{
  ov.addEventListener('click', e => { if(e.target === ov) closeSheet(ov.id); });
});
document.querySelectorAll('[data-close]').forEach(btn=>{
  btn.onclick = () => { haptic.tap(); closeSheet(btn.closest('.overlay').id); };
});
// На десктопе Esc закрывает верхнюю шторку — этого ждут по привычке, а на
// телефоне ту же роль играет нативная BackButton Telegram.
document.addEventListener('keydown', e => {
  if(e.key === 'Escape' && sheetStack.length){ e.preventDefault(); closeTopSheet(); }
});

document.getElementById('lightboxClose').onclick = closeLightbox;
document.getElementById('lightbox').addEventListener('click', e => {

// Favicon генерируем на лету из знака магазина и цвета темы — отдельный файл
// заводить не нужно, и он автоматически совпадает с оформлением витрины.
function applyFavicon(s){
  const accent = themeHex('--accent') || '#e8341c';
  const bg = themeHex('--bg') || '#0d0d0d';
  const mark = LOGO_MARKS[s.brand.logoMark];
  const inner = mark && mark.svg
    ? `<g fill="${accent}" transform="translate(8 8) scale(1.33)">${mark.svg}</g>`
    : `<text x="50%" y="54%" font-size="30" text-anchor="middle" dominant-baseline="middle">${esc(s.brand.shopIcon || '🛒')}</text>`;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"><rect width="48" height="48" fill="${bg}"/>${inner}</svg>`;
  let link = document.getElementById('favicon');
  if(!link){
    link = document.createElement('link');
    link.id = 'favicon'; link.rel = 'icon'; link.type = 'image/svg+xml';
    document.head.appendChild(link);
  }
  link.href = 'data:image/svg+xml,' + encodeURIComponent(svg);
}

// --- применение настроек к витрине ---
// В режиме colorScheme=telegram подмешиваем цвета клиента из themeParams,
// чтобы мини-апп не спорил с оболочкой. Вынесено в функцию: её же зовём из
// обработчика themeChanged при смене темы в самом Telegram.
function telegramThemeMix(t){
  if(t.colorScheme !== 'telegram' || !tg?.themeParams?.bg_color) return null;
  const tp = tg.themeParams;
  // Только реально присланные ключи: отсутствующий цвет Telegram не должен
  // затирать палитру продавца значением undefined.
  const mix = {};
  if(tp.bg_color) mix.bg = tp.bg_color;
  if(tp.secondary_bg_color){ mix.surface = tp.secondary_bg_color; mix.surface2 = tp.secondary_bg_color; }
  if(tp.text_color) mix.text = tp.text_color;
  if(tp.hint_color) mix.muted = tp.hint_color;
  if(tp.button_color) mix.accent = tp.button_color;
  if(tp.link_color) mix.accent2 = tp.link_color;
  return mix;
}

function applySettings(s){
  settings = s;
  const t = s.theme;

  // тема: пресет + ручные переопределения + (опционально) цвета Telegram
  const themeInput = Object.assign({}, t, telegramThemeMix(t) || {});
  applyTheme(themeInput);
  syncColorScheme();
  setCurrency({ symbol: s.commerce.currency, position: s.commerce.currencyPosition, locale: s.advanced.locale });

  document.body.classList.toggle('grain', !!t.grain);
  document.body.classList.toggle('diagonal', !!t.diagonal);
  document.body.classList.toggle('anim-off', t.animations === 'off');
  document.body.classList.toggle('anim-reduced', t.animations === 'reduced');
  document.getElementById('customCss').textContent = t.customCss || '';
  document.documentElement.style.setProperty('--cols', t.gridColumns);
  document.documentElement.style.setProperty('--ratio',
    t.imageRatio === 'square' ? '1/1' : t.imageRatio === 'portrait' ? '3/4' : '4/3');

  // Произвольный hex в setHeaderColor разрешён только с Bot API 6.9 — на клиентах
  // старее SDK бросает WebAppHeaderColorKeyInvalid. На них откатываемся на
  // ключевое слово bg_color, которое поддерживается с 6.1.
  const bgHex = themeHex('--bg');
  try{
    if(tg?.setHeaderColor) tg.setHeaderColor(tg.isVersionAtLeast?.('6.9') && bgHex ? bgHex : 'bg_color');
    if(tg?.setBackgroundColor && bgHex) tg.setBackgroundColor(bgHex);
  }catch(e){}

  // бренд
  document.title = s.brand.shopName;
  // Приоритет знака: загруженная картинка → готовый знак → эмодзи.
  // Так продавец может начать с эмодзи и потом заменить его, ничего не сбрасывая.
  const mark = s.brand.logoImage
    ? `<img src="/api/image?id=${encodeURIComponent(s.brand.logoImage)}" alt="">`
    : (logoMarkSVG(s.brand.logoMark) || `<span>${esc(s.brand.shopIcon)}</span>`);
  document.getElementById('shopLogo').innerHTML = `${mark}<span class="logo-text">${esc(s.brand.shopName)}</span>`;
  applyFavicon(s);
  document.getElementById('appHeader').className = s.brand.headerStyle === 'minimal' ? 'minimal' : '';
  const tagline = document.getElementById('tagline');
  tagline.style.display = s.brand.showTagline && s.brand.tagline ? '' : 'none';
  tagline.textContent = s.brand.tagline;

  sizeMarquee(t);

  // каталог
  document.getElementById('searchBox').style.display = s.catalog.showSearch ? '' : 'none';
  document.getElementById('sortSelect').style.display = s.catalog.showSort ? '' : 'none';
  sortMode = s.catalog.defaultSort;
  document.getElementById('sortSelect').value = sortMode;

  // коммерция
  document.getElementById('cartBtn').style.display = (s.commerce.enableCart && s.commerce.mode === 'cart') ? '' : 'none';
  document.getElementById('favBtn').style.display = s.commerce.enableFavorites ? '' : 'none';

  // Режим обслуживания. Переключение симметричное: раньше витрина только
  // пряталась и обратно не возвращалась — в превью админки после снятия галочки
  // оставался пустой экран, и казалось, что превью сломалось.
  const off = s.advanced.maintenanceMode;
  document.getElementById('app').style.display = off ? 'none' : '';
  document.getElementById('maintenance').style.display = off ? 'block' : 'none';
  document.getElementById('maintenanceText').textContent = s.advanced.maintenanceText;
  if(off) document.getElementById('cartBtn').style.display = 'none';

  document.getElementById('profileAbout').textContent = s.profile.aboutText || '';
  const avatarBtn = document.getElementById('profileBtn');
  avatarBtn.className = 'avatar-btn menu-' + (s.profile.avatarHint || 'caret');
  renderProfileMenu();

  // запоминаем тему для мгновенного старта в следующий раз (в превью не пишем —
  // там настройки несохранённые, и они не должны попасть в кэш витрины)
  if(!IS_PREVIEW) cacheTheme(s.theme, s.brand);

  // цвета нативной MainButton берутся из темы — после перекраски их надо
  // пересинхронизировать, иначе кнопка останется в прошлой палитре
  syncMainButton();
}

async function loadSettings(){
  try{
    const res = await fetch('/api/settings');
    if(!res.ok) throw new Error('bad status');
    applySettings(await res.json());
    settingsLoaded = true;
  }catch(e){
    // без настроек витрина всё равно должна открыться — просто с дефолтной темой
    showToast('Не удалось загрузить оформление', true);
  }
}

// pending — уже запущенный запрос (старт мини-аппа качает каталог параллельно
// с настройками); без него — свежий запрос, как при «Повторить» и после заказа.
async function loadProducts(pending){
  try{
    const res = await (pending || fetch('/api/products'));
    if(!res.ok) throw new Error('bad status');
    products = await res.json();
    loadError = false;
  }catch(e){
    loadError = true;
    renderGrid();
    return;
  }
  // Каталог приехал — выкидываем из корзины и избранного то, чего больше нет,
  // и сразу сохраняем: иначе мусор копился бы в localStorage бесконечно.
  const alive = id => products.some(p => p.id === id);
  let pruned = false;
  for(const id of [...cart.keys()]) if(!alive(id)){ cart.delete(id); pruned = true; }
  for(const id of [...favorites]) if(!alive(id)){ favorites.delete(id); pruned = true; }
  if(pruned) saveState();

  renderCategories();
  renderGrid();
  renderFavList();
  updateFavUI();
  updateCartUI();

  // пришли по ссылке из публикации в канале — сразу открываем нужный товар
  const startParam = tg?.initDataUnsafe?.start_param;
  if(startParam && /^\d+$/.test(startParam)){
    const target = products.find(p => p.id === Number(startParam));
    if(target) openDetail(target.id);
  }
}

// Режим превью в админке: та же самая витрина, но настройки прилетают
// сообщением, а не с сервера. Принимаем только со своего origin — иначе любая
// страница, встроившая нас в iframe, могла бы подменить магазин.
const IS_PREVIEW = new URLSearchParams(location.search).has('preview');
if(IS_PREVIEW){
  document.body.classList.add('in-preview');
  // Превью прячем до первых настроек из админки: иначе видно, как оно
  // рисуется дефолтной тёмной темой и только потом перекрашивается в нужную.
  document.documentElement.style.visibility = 'hidden';
  const reveal = () => { document.documentElement.style.visibility = ''; };
  // страховка, если админка почему-то не ответит — лучше показать хоть что-то
  setTimeout(reveal, 1500);

  window.addEventListener('message', e => {
    if(e.origin !== location.origin) return;
    if(!e.data || e.data.type !== 'shop-preview-settings') return;
    try{
      applySettings(e.data.settings);
      renderCategories();
      renderGrid();
      reveal();
      // подтверждаем, ЧТО именно применили: админка сверяет это с текущим
      // состоянием и повторит отправку, если превью отстало
      parent.postMessage({ type: 'shop-preview-applied', applied: JSON.stringify(e.data.settings) }, location.origin);
    }catch(err){
      console.error('[preview] не удалось применить настройки:', err);
    }
  });
  // сообщаем админке, что готовы принимать настройки: иначе сообщение,
  // отправленное до нашей загрузки, просто потерялось бы
  try{ parent.postMessage({ type: 'shop-preview-ready' }, location.origin); }catch(e){}
  // страховка: если страницу открыли с ?preview=1 напрямую, без админки —
  // через секунду берём настройки с сервера, чтобы не остаться пустыми
  setTimeout(() => { if(!settings) loadSettings().then(renderGrid); }, 1000);
}

// Возврат из платёжного сервиса. Мерчант присылает покупателя на /?paid=<id>
// или /?failed=<id>; без обработки человек попадал просто в каталог и не
// понимал, прошла оплата или нет. Открывается это обычно во встроенном
// браузере Telegram, где мини-апп-API недоступно, поэтому обходимся своей
// разметкой и не дёргаем SDK.
(function handlePaymentReturn(){
  const q = new URLSearchParams(location.search);
  const paid = q.get('paid'), failed = q.get('failed'), token = q.get('t');
  if(!paid && !failed) return;
  const orderId = paid || failed;

  const box = document.createElement('div');
  box.className = 'pay-return';
  const render = (kind, title, text) => {
    box.innerHTML = `
      <div class="pay-card ${kind === 'ok' ? 'ok' : 'bad'}">
        <div class="pay-icon">${kind === 'ok' ? '✓' : kind === 'wait' ? '…' : '!'}</div>
        <div class="pay-title">${esc(title)}</div>
        <div class="pay-text">${esc(text)}</div>
        <div class="pay-order">Заказ №${esc(orderId)}</div>
        ${kind === 'wait' ? '' : `<button class="checkout-btn" id="payBackBtn">Вернуться в магазин</button>`}
      </div>`;
    const back = document.getElementById('payBackBtn');
    if(back) back.onclick = () => {
      box.remove();
      // чистим адрес, чтобы обновление страницы не показывало экран снова
      history.replaceState(null, '', location.pathname);
    };
  };

  // Возврат от мерчанта сам по себе не значит «оплачено»: покупатель мог
  // закрыть страницу оплаты, а адрес с ?paid= вообще открывается руками.
  // Единственный источник правды — колбэк мерчанта, поэтому спрашиваем статус
  // у сервера. Колбэк иногда приходит на секунду-две позже редиректа, отсюда
  // несколько попыток вместо одной.
  async function verify(attempt){
    try{
      const res = await fetch(`/api/pay/status?id=${encodeURIComponent(orderId)}&t=${encodeURIComponent(token || '')}`);
      if(res.ok){
        const d = await res.json();
        if(d.paid){
          render('ok', 'Оплата получена',
            (settings && settings.payments && settings.payments.successText) || 'Спасибо! Заказ оплачен.');
          return;
        }
      }
    }catch(e){ /* сеть моргнула — ниже решим по числу попыток */ }

    if(attempt < 3){
      render('wait', 'Проверяем оплату', 'Это занимает несколько секунд.');
      setTimeout(() => verify(attempt + 1), 2000);
      return;
    }
    // Больше не ждём. Формулировка намеренно осторожная: мы не знаем, что
    // деньги не ушли — мы знаем только, что подтверждения пока нет.
    if(failed){
      render('bad', 'Оплата не прошла', 'Деньги не списаны. Можно попробовать ещё раз или написать менеджеру.');
    } else {
      render('bad', 'Оплата пока не подтверждена',
        'Если деньги списались, заказ отметится оплаченным в течение нескольких минут. Менеджер это увидит.');
    }
  }

  const start = () => {
    render('wait', 'Проверяем оплату', 'Это занимает несколько секунд.');
    document.body.appendChild(box);
    verify(1);
  };
  // ждём настройки ради текста и темы, но не дольше секунды
  if(settings) start(); else setTimeout(start, 900);
})();

// порядок применения важен: сперва тема (иначе увидим вспышку дефолтной), потом
// товары. А вот качать их можно одновременно: раньше каталог ждал, пока придут
// настройки, и открытие мини-аппа теряло целый сетевой круг.
renderSkeletons();
(async () => {
  const productsReq = fetch('/api/products');
  productsReq.catch(() => {}); // ошибку разберёт loadProducts, не unhandledrejection
  // В превью настройки приходят из админки сообщением. Тянуть их ещё и с сервера
  // нельзя: ответ может прийти ПОСЛЕ пуша и затереть несохранённые правки —
  // продавец увидел бы, что его изменения «откатываются» сами.
  if(!IS_PREVIEW) await loadSettings();
  await loadProducts(productsReq);
})();

// возвращаем позицию скролла при повторном входе в мини-апп
window.addEventListener('beforeunload', () => {
  try{ sessionStorage.setItem(LS.scroll, String(window.scrollY)); }catch(e){}
});
window.addEventListener('load', () => {
  try{
    const y = Number(sessionStorage.getItem(LS.scroll));
    if(y) setTimeout(() => window.scrollTo(0, y), 120);
  }catch(e){}
});

// --- реальная аватарка с бэкенда ---
if(tg?.initData){
  fetch(`/api/avatar?initData=${encodeURIComponent(tg.initData)}`)
    .then(r => r.ok ? r.blob() : Promise.reject())
    .then(blob => {
      const url = URL.createObjectURL(blob);
      document.getElementById('avatarImg').src = url;
      document.getElementById('profileAvatarImg').src = url;
    })
    .catch(() => {}); // тихо остаёмся на дефолтной аватарке
}
</script>
