<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Админка магазина</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- media="print" снимает блокировку рендера: браузер грузит файл в фоне,
     а onload переключает его на экранные стили. Без этого админка ждала
     ответа fonts.googleapis.com прежде чем показать хоть что-то. -->
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&display=swap"
      rel="stylesheet" media="print" onload="this.media='all'">
<style>
  :root{
    --bg:#0d0d0d; --surface:#161616; --surface-2:#202020;
    --text:#f2efe6; --muted:#8a8880; --accent:#e8341c; --accent-2:#f2c94c; --danger:#e8341c;
    /* Текст НА акцентном фоне. Раньше кнопки брали color:var(--text), и на
       светлом акценте (например белом у пресета ERD) получалось белое по
       белому — те самые «белые кнопки». */
    --on-accent:#ffffff;
    --font-display:'Oswald',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;min-height:100vh;padding:0 0 90px;-webkit-tap-highlight-color:transparent}
  button,input,textarea,select{font:inherit;color:inherit}
  input,textarea,select{background:var(--surface-2);border:1px solid var(--surface-2);padding:10px 12px;outline:none;width:100%;font-size:15px}
  input:focus,textarea:focus,select:focus{border-color:var(--accent)}
  textarea{resize:vertical;min-height:70px;font-size:14px;line-height:1.5}
  input[type=color]{padding:2px;height:38px;cursor:pointer}
  input[type=range]{padding:0;accent-color:var(--accent)}
  button{background:var(--accent);color:var(--on-accent);border:none;padding:11px 16px;font-family:var(--font-display);letter-spacing:.4px;text-transform:uppercase;font-weight:600;cursor:pointer;transition:opacity .15s}
  button:active{opacity:.75}
  button.secondary{background:var(--surface-2);color:var(--text)}
  button.ghost{background:transparent;border:1px solid var(--surface-2);color:var(--muted)}
  button:disabled{opacity:.4;cursor:default}
  a{color:var(--accent-2)}

  .login{max-width:320px;margin:18vh auto 0;display:flex;flex-direction:column;gap:10px;text-align:center;padding:0 16px}
  .login h1{font-family:var(--font-display);font-size:20px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;margin-bottom:6px}
  .login .err{color:var(--danger);font-size:13px;min-height:18px}

  .wrap{max-width:620px;margin:0 auto;display:none;padding:0 14px}
  .wrap.open{display:block}

  .topbar{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:2px solid var(--accent);padding:12px 14px 0;margin:0 -14px 16px}
  .topbar h1{font-family:var(--font-display);font-size:17px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:10px}
  .topbar h1 small{font-family:inherit;font-size:11px;color:var(--muted);text-transform:none;letter-spacing:0;font-weight:400}
  .tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:10px}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex-shrink:0;padding:9px 13px;background:var(--surface);border:1px solid var(--surface-2);font-family:var(--font-display);font-size:12px;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);cursor:pointer;white-space:nowrap}
  .tab.active{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

  .panel{display:none}
  .panel.active{display:block}

  .card{background:var(--surface);border:1px solid var(--surface-2);border-top:2px solid var(--accent);padding:16px;margin-bottom:14px}
  .card h2{font-family:var(--font-display);font-size:14px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;margin-bottom:6px}
  .card .hint{font-size:11.5px;color:var(--muted);line-height:1.5;margin-bottom:12px}
  .field{margin-bottom:12px}
  .field:last-child{margin-bottom:0}
  .field label{display:block;font-size:11px;letter-spacing:.3px;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
  .field .sub{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.4}
  .row2{display:flex;gap:8px;flex-wrap:wrap}
  .row2>.field{flex:1;min-width:130px}

  .switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--surface-2)}
  .switch:last-child{border-bottom:none}
  .switch .lbl{font-size:13.5px}
  .switch .lbl small{display:block;color:var(--muted);font-size:11px;margin-top:2px;line-height:1.4}
  .switch-track{width:44px;height:26px;background:var(--surface-2);border:1px solid var(--muted);position:relative;cursor:pointer;flex-shrink:0;transition:background .15s}
  .switch-track.on{background:var(--accent);border-color:var(--accent)}
  .switch-thumb{width:18px;height:18px;background:var(--text);position:absolute;top:3px;left:3px;transition:transform .15s}
  .switch-track.on .switch-thumb{transform:translateX(18px);background:var(--on-accent)}

  .promo-item{background:var(--surface-2);padding:12px;margin-bottom:10px;border-left:3px solid var(--accent)}
  .promo-item.off{opacity:.5;border-left-color:var(--muted)}
  .promo-item .field{margin-bottom:8px}
  .promo-used{font-size:11px;color:var(--muted);margin-top:2px}
  .marks{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:8px}
  .mark{
    aspect-ratio:1;border:2px solid var(--surface-2);background:var(--surface-2);
    display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text);
    transition:border-color .15s,color .15s;
  }
  .mark:hover{border-color:var(--muted)}
  .mark.active{border-color:var(--accent);color:var(--accent)}

  .presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
  .preset{border:2px solid var(--surface-2);padding:8px;cursor:pointer;text-align:center}
  .preset.active{border-color:var(--accent)}
  .preset .swatches{display:flex;height:26px;margin-bottom:6px}
  .preset .swatches i{flex:1}
  .preset span{font-size:10.5px;color:var(--muted);letter-spacing:.2px}

  .tag-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .tag{display:flex;align-items:center;gap:6px;background:var(--surface-2);padding:7px 7px 7px 11px;font-size:12.5px}
  .tag button{width:20px;height:20px;padding:0;background:transparent;color:var(--muted);font-size:15px;line-height:1}
  .tag-input-row{display:flex;gap:6px;margin-top:8px}
  .tag-input-row button{flex:0 0 46px;padding:0}

  .rowitem{display:flex;gap:6px;margin-bottom:8px}
  .rowitem input{flex:1}
  .rowitem input.narrow{flex:0 0 100px}
  .row-remove{width:42px;flex-shrink:0;background:var(--surface-2);color:var(--danger);display:flex;align-items:center;justify-content:center;padding:0}
  .row-remove svg{width:15px;height:15px}

  .upload-box{display:flex;align-items:center;gap:12px;background:var(--surface-2);padding:10px}
  .upload-preview{width:54px;height:54px;background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--muted);overflow:hidden;flex-shrink:0}
  .upload-preview img{width:100%;height:100%;object-fit:cover}
  .upload-label{flex:1;font-size:12px;color:var(--muted);cursor:pointer}
  .upload-label input{display:none}
  .upload-label .btn-fake{display:inline-block;background:var(--surface);padding:9px 14px;font-size:12px;font-weight:600;color:var(--text)}

  .photo-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
  .photo-slot{position:relative;aspect-ratio:1;background:var(--surface-2);border:1px dashed var(--muted);display:flex;align-items:center;justify-content:center;color:var(--muted);overflow:hidden;cursor:pointer}
  .photo-slot.filled{border-style:solid;border-color:var(--surface-2);cursor:default}
  .photo-slot img{width:100%;height:100%;object-fit:cover}
  .photo-slot input{display:none}
  .photo-slot .photo-remove{position:absolute;top:3px;right:3px;width:22px;height:22px;background:rgba(0,0,0,.65);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px}
  .photo-slot .photo-main-tag{position:absolute;bottom:0;left:0;right:0;background:var(--accent);color:var(--on-accent);font-size:9px;font-weight:700;text-align:center;text-transform:uppercase;padding:2px 0}

  .list{display:flex;flex-direction:column;gap:8px}
  .list-title{font-family:var(--font-display);font-size:15px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;margin:20px 0 10px}
  .row{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--surface-2);padding:10px}
  .row.hidden-prod{opacity:.5}
  .row .thumb{width:46px;height:46px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--muted);overflow:hidden;flex-shrink:0}
  .row .thumb img{width:100%;height:100%;object-fit:cover}
  .row .info{flex:1;min-width:0}
  .row .name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .meta{display:flex;align-items:center;gap:6px;margin-top:3px;flex-wrap:wrap}
  .row .price{font-family:var(--font-display);font-size:12px;color:var(--accent-2);font-weight:600}
  .row .category{font-size:11px;color:var(--muted);background:var(--surface-2);padding:2px 7px}
  .row .actions{display:flex;gap:5px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end;max-width:112px}
  .row .actions button:disabled{opacity:.25}
  .row button.icon-toggle{padding:0;width:32px;height:32px;display:flex;align-items:center;justify-content:center;background:var(--surface-2)}
  .row button.icon-toggle svg{width:14px;height:14px}
  .row button.icon-toggle.on{background:var(--accent);color:var(--on-accent)}
  .views-count{display:flex;align-items:center;gap:3px;font-size:11px;color:var(--muted)}
  .views-count svg{width:12px;height:12px}

  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px;margin-bottom:14px}
  .stat{background:var(--surface);border:1px solid var(--surface-2);border-left:3px solid var(--accent);padding:11px}
  .stat b{display:block;font-family:var(--font-display);font-size:19px;color:var(--accent-2)}
  .stat span{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px}

  /* состояние VPS */
  .vps-row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--surface-2);font-size:13px}
  .vps-row:last-child{border-bottom:none}
  .vps-row .k{color:var(--muted)}
  .vps-row b{font-weight:600;text-align:right;overflow-wrap:anywhere}

  .order{background:var(--surface);border:1px solid var(--surface-2);padding:12px;margin-bottom:8px}
  .order .head{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:6px}
  .order pre{white-space:pre-wrap;font-family:inherit;font-size:12.5px;line-height:1.5}

  .empty{color:var(--muted);text-align:center;padding:26px 0;font-size:13px}

  /* выбор темы самой админки — те же карточки-пресеты, что у витрины */
  .preset .swatches.on-accent i:last-child{outline:1px solid var(--muted);outline-offset:-1px}

  /* Десктоп. Раньше админка оставалась колонкой 620px на любом мониторе:
     на 1600px две трети экрана пустовали, а 14 вкладок (больше 1000px) не
     влезали и требовали горизонтальной прокрутки — нужную приходилось искать
     вслепую. Даём ширину и разрешаем вкладкам переноситься. */
  @media (min-width:1000px){
    body{padding-top:0}
    .wrap{max-width:980px;padding:0 20px}
    .topbar{margin:0 -20px 20px;padding:16px 20px 0}
    .tabs{flex-wrap:wrap;overflow:visible}
    .tab{font-size:12.5px;padding:9px 14px}
    /* поля в две колонки — форма товара и настройки перестают быть длинной кишкой */
    .row2>.field{min-width:180px}
    .card{padding:20px}
    .savebar .inner{max-width:980px}
    .dialog{max-width:440px}
    /* превью витрины и настройки рядом, а не друг под другом */
    .preview-card{position:sticky;top:96px}
  }
  @media (min-width:1280px){
    .wrap{max-width:1180px}
    .savebar .inner{max-width:1180px}
    /* панель «Тема» в две колонки: слева телефон с превью, справа параметры */
    #panel-theme{columns:2;column-gap:18px}
    #panel-theme>.card{break-inside:avoid;margin-bottom:18px}
  }

  /* превью витрины «в телефоне» */
  .preview-card h2{align-items:center}
  .phone{
    width:100%;max-width:300px;margin:0 auto;aspect-ratio:9/17;
    border:8px solid #000;border-radius:26px;overflow:hidden;background:#000;
    box-shadow:0 6px 26px rgba(0,0,0,.5);
  }
  .phone iframe{width:100%;height:100%;border:0;display:block}

  /* диагностика */
  .check{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--surface-2)}
  .check:last-child{border-bottom:none}
  .check .mark{flex:0 0 20px;font-size:15px;line-height:1.3}
  .check.ok .mark{color:#3ec98a}
  .check.bad .mark{color:var(--danger)}
  .check .body{flex:1;min-width:0}
  .check .t{font-size:13.5px;font-weight:600}
  .check .d{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.45;word-break:break-word}
  .check .fix{font-size:11.5px;color:var(--accent-2);margin-top:5px;line-height:1.45}

  /* чек-лист запуска */
  .steps{counter-reset:s}
  .step{display:flex;gap:10px;align-items:flex-start;padding:9px 0;cursor:pointer}
  .step .num{flex:0 0 22px;height:22px;background:var(--surface-2);color:var(--muted);
    display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
  .step.done .num{background:#3ec98a;color:#000}
  .step .txt{font-size:13px;line-height:1.4}
  .step.done .txt{color:var(--muted);text-decoration:line-through}
  .progress{height:5px;background:var(--surface-2);margin:10px 0 14px}
  .progress i{display:block;height:100%;background:var(--accent);transition:width .3s}
  .savebar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:2px solid var(--accent);padding:11px 14px;display:none;z-index:30}
  .savebar.show{display:block}
  .savebar .inner{max-width:620px;margin:0 auto;display:flex;gap:10px;align-items:center}
  .savebar button{flex:1}
  .savebar .status{font-size:12px;color:var(--accent-2);flex:0 0 auto}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:80px;background:var(--surface-2);border:1px solid var(--accent);padding:11px 16px;font-size:13px;z-index:50;max-width:90%;text-align:center;line-height:1.45}
  .toast.err{background:var(--danger);border-color:var(--danger);color:#fff;font-weight:600}

  .dialog-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:60;display:flex;align-items:center;justify-content:center;padding:20px}
  .dialog{background:var(--surface);border:1px solid var(--surface-2);border-top:2px solid var(--accent);padding:20px;max-width:400px;width:100%}
  .dialog-text{font-size:14px;line-height:1.5;margin-bottom:18px}
  .dialog-actions{display:flex;gap:8px}
  .dialog-actions button{flex:1}
</style>
</head>
<body>

<div class="login" id="loginBox">
  <h1>Вход в админку</h1>
  <input type="password" id="tokenInput" placeholder="Админ-токен" autocomplete="current-password">
  <button id="loginBtn">Войти</button>
  <div class="err" id="loginErr"></div>
</div>

<div class="wrap" id="wrap">
  <div class="topbar">
    <h1><span id="shopTitle">Магазин</span> <small id="botStatus"></small></h1>
    <div class="tabs" id="tabs"></div>
  </div>

  <!-- Превью живёт ВНЕ panel-theme: панель перерисовывается на каждое изменение,
       а пересоздание <iframe> заставляло бы витрину перезагружаться и мигать. -->
  <div class="card preview-card" id="previewHost" style="display:none">
    <h2>Как это выглядит <button type="button" class="ghost" id="previewReload" style="padding:5px 10px;font-size:11px">Обновить</button></h2>
    <div class="hint">Настоящая витрина с вашими товарами. Меняйте параметры ниже — превью перерисуется само.</div>
    <div class="phone"><iframe id="previewFrame" src="/index.html?preview=1" title="Превью витрины"></iframe></div>
  </div>

  <div class="panel" id="panel-dashboard"></div>
  <div class="panel" id="panel-brand"></div>
  <div class="panel" id="panel-theme"></div>
  <div class="panel" id="panel-catalog"></div>
  <div class="panel" id="panel-commerce"></div>
  <div class="panel" id="panel-checkout"></div>
  <div class="panel" id="panel-payments"></div>
  <div class="panel" id="panel-promo"></div>
  <div class="panel" id="panel-notify"></div>
  <div class="panel" id="panel-bot"></div>
  <div class="panel" id="panel-channel"></div>
  <div class="panel" id="panel-products"></div>
  <div class="panel" id="panel-orders"></div>
  <div class="panel" id="panel-advanced"></div>
</div>

<div class="savebar" id="savebar">
  <div class="inner">
    <span class="status" id="saveStatus"></span>
    <button id="saveBtn">Сохранить настройки</button>
  </div>
</div>

<!-- ?v= бампается при релизе: страхует от промежуточных прокси, которые
     игнорируют no-cache и держат старый shared.js поверх новой разметки -->
<script src="/theme-core.js?v=2.4"></script>
<script src="/shared.js?v=2.4"></script>
<script>
let TOKEN = '';
let settings = null;
let products = [];
let views = {};
let stats = {};
let orders = [];
let dirty = false;

const $ = id => document.getElementById(id);

// ---------- темы самой админки ----------
// Админка — интерфейс продавца, а не покупателя, поэтому у неё СОБСТВЕННЫЕ
// темы, не зависящие от палитры витрины. Раньше applyTheme(settings.theme)
// перекрашивала админку темой магазина: стоило выбрать светлый пресет
// (например market), и админка становилась белой — это и была «тема снова
// светлая». Витрина при этом остаётся в живом превью справа.
const ADMIN_THEMES = {
  graphite: { label:'Графит', vars:{
    '--bg':'#0d0d0d','--surface':'#161616','--surface-2':'#202020','--text':'#f2efe6','--muted':'#8a8880',
    '--accent':'#e8341c','--accent-2':'#f2c94c','--danger':'#e8341c','--on-accent':'#ffffff' }},
  light: { label:'Светлая', vars:{
    '--bg':'#f4f3ef','--surface':'#ffffff','--surface-2':'#e7e5dd','--text':'#1c1b17','--muted':'#6d6a60',
    '--accent':'#c53016','--accent-2':'#0f6bb0','--danger':'#c53016','--on-accent':'#ffffff' }},
  ocean: { label:'Океан', vars:{
    '--bg':'#0b1220','--surface':'#131c2e','--surface-2':'#1d2a42','--text':'#e9eef7','--muted':'#90a2bf',
    '--accent':'#2f80ed','--accent-2':'#56c2ff','--danger':'#ff6b5e','--on-accent':'#ffffff' }},
  contrast: { label:'Контраст', vars:{
    '--bg':'#000000','--surface':'#101010','--surface-2':'#222222','--text':'#ffffff','--muted':'#cfcfcf',
    '--accent':'#ffd60a','--accent-2':'#7ef2ff','--danger':'#ff5d5d','--on-accent':'#000000' }},
};
const LS_ADMIN_THEME = 'admin_theme_v1';
function getAdminTheme(){
  try{ const v = localStorage.getItem(LS_ADMIN_THEME); return ADMIN_THEMES[v] ? v : 'graphite'; }
  catch(e){ return 'graphite'; }
}
function applyAdminTheme(name, persist = true){
  const t = ADMIN_THEMES[name] || ADMIN_THEMES.graphite;
  const st = document.documentElement.style;
  Object.entries(t.vars).forEach(([k, v]) => st.setProperty(k, v));
  st.colorScheme = name === 'light' ? 'light' : 'dark';
  if(persist) try{ localStorage.setItem(LS_ADMIN_THEME, name); }catch(e){}
}
// применяем до логина, чтобы экран входа сразу был в выбранной теме
try{ applyAdminTheme(localStorage.getItem(LS_ADMIN_THEME) || 'graphite', false); }
catch(e){ applyAdminTheme('graphite', false); }

// ---------- доступ к настройкам по пути 'theme.accent' ----------
function getPath(obj, path){ return path.split('.').reduce((o,k)=> (o==null?o:o[k]), obj); }
function setPath(obj, path, value){
  const keys = path.split('.');
  const last = keys.pop();
  let cur = obj;
  for(const k of keys){ if(typeof cur[k] !== 'object' || cur[k] === null) cur[k] = {}; cur = cur[k]; }
  cur[last] = value;
  markDirty();
}
function markDirty(){ dirty = true; $('savebar').classList.add('show'); $('saveStatus').textContent = ''; }

// ---------- API ----------
async function api(path, opts = {}){
  const res = await fetch(path, {
    ...opts,
    headers: { 'Content-Type': 'application/json', 'x-admin-token': TOKEN, ...(opts.headers||{}) }
  });
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
  return data;
}

// Собственные уведомления и подтверждения вместо alert/confirm: во встроенном
// браузере Telegram нативные диалоги блокируются молча, и продавец видит, что
// «кнопка не работает», без единого сообщения об ошибке.
function toast(msg, isError){
  document.querySelectorAll('.toast').forEach(t => t.remove()); // не копим стопку
  const el = document.createElement('div');
  el.className = 'toast' + (isError ? ' err' : '');
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(()=> el.remove(), isError ? 4200 : 2600);
}

// Промис-подтверждение с фокусом и Esc — замена confirm()
function confirmDialog(text, okLabel = 'Удалить'){
  return new Promise(resolve => {
    const wrap = document.createElement('div');
    wrap.className = 'dialog-backdrop';
    wrap.innerHTML = `
      <div class="dialog" role="alertdialog" aria-modal="true">
        <div class="dialog-text"></div>
        <div class="dialog-actions">
          <button type="button" class="secondary" data-no>Отмена</button>
          <button type="button" data-yes>${esc(okLabel)}</button>
        </div>
      </div>`;
    wrap.querySelector('.dialog-text').textContent = text;
    document.body.appendChild(wrap);
    const close = v => { wrap.remove(); document.removeEventListener('keydown', onKey); resolve(v); };
    const onKey = e => { if(e.key === 'Escape') close(false); if(e.key === 'Enter') close(true); };
    document.addEventListener('keydown', onKey);
    wrap.querySelector('[data-no]').onclick = () => close(false);
    wrap.querySelector('[data-yes]').onclick = () => close(true);
    wrap.onclick = e => { if(e.target === wrap) close(false); };
    wrap.querySelector('[data-yes]').focus();
  });
}

// ---------- конструктор полей ----------
// Каждое поле описывается декларативно и само себя рисует и связывает с settings.
// Добавить новую настройку = дописать одну строку в описание вкладки.
const F = {
  text: (path, label, opts={}) => ({ type:'text', path, label, ...opts }),
  area: (path, label, opts={}) => ({ type:'area', path, label, ...opts }),
  num:  (path, label, opts={}) => ({ type:'num', path, label, ...opts }),
  range:(path, label, opts={}) => ({ type:'range', path, label, ...opts }),
  color:(path, label, opts={}) => ({ type:'color', path, label, ...opts }),
  sw:   (path, label, opts={}) => ({ type:'switch', path, label, ...opts }),
  sel:  (path, label, options, opts={}) => ({ type:'select', path, label, options, ...opts }),
  tags: (path, label, opts={}) => ({ type:'tags', path, label, ...opts }),
  links:(path, label, opts={}) => ({ type:'links', path, label, ...opts }),
  lines:(path, label, opts={}) => ({ type:'lines', path, label, ...opts }),
};

function renderField(f){
  const v = getPath(settings, f.path);
  const id = 'f_' + f.path.replace(/\./g, '_');
  const sub = f.sub ? `<div class="sub">${f.sub}</div>` : '';

  switch(f.type){
    case 'switch':
      return `<div class="switch"><div class="lbl">${f.label}${f.sub?`<small>${f.sub}</small>`:''}</div>
        <div class="switch-track ${v?'on':''}" id="${id}" data-path="${f.path}" data-kind="switch"><div class="switch-thumb"></div></div></div>`;
    case 'area':
      return `<div class="field"><label>${f.label}</label>
        <textarea id="${id}" data-path="${f.path}" data-kind="text" placeholder="${f.ph||''}">${esc(v||'')}</textarea>${sub}</div>`;
    case 'num':
      return `<div class="field"><label>${f.label}</label>
        <input type="number" id="${id}" data-path="${f.path}" data-kind="num" value="${v ?? ''}" min="${f.min ?? 0}" max="${f.max ?? 999999}" placeholder="${f.ph||''}">${sub}</div>`;
    case 'range':
      return `<div class="field"><label>${f.label}: <b id="${id}_v">${v}</b>${f.unit||''}</label>
        <input type="range" id="${id}" data-path="${f.path}" data-kind="range" value="${v}" min="${f.min}" max="${f.max}" step="${f.step||1}">${sub}</div>`;
    case 'color': {
      // если ручного значения нет — показываем то, что реально сейчас на экране
      // (цвет из пресета), иначе поле врало бы чёрным на светлой теме
      const key = f.path.split('.').pop();
      const shown = /^#[0-9a-f]{6}$/i.test(v || '') ? v : (resolveTheme(settings.theme)[key] || f.fallback || '#000000');
      return `<div class="field"><label>${f.label}</label>
        <input type="color" id="${id}" data-path="${f.path}" data-kind="text" value="${shown}">${sub}</div>`;
    }
    case 'select':
      return `<div class="field"><label>${f.label}</label>
        <select id="${id}" data-path="${f.path}" data-kind="${f.numeric?'num':'text'}">
          ${f.options.map(o=>`<option value="${esc(o[0])}" ${String(v)===String(o[0])?'selected':''}>${esc(o[1])}</option>`).join('')}
        </select>${sub}</div>`;
    case 'tags':
      return `<div class="field"><label>${f.label}</label><div id="${id}" data-tags="${f.path}"></div>
        <button type="button" class="secondary" data-addtag="${f.path}" data-target="${id}" style="width:100%;margin-top:8px">+ Добавить</button>${sub}</div>`;
    case 'links':
      return `<div class="field"><label>${f.label}</label><div id="${id}" data-links="${f.path}"></div>
        <button type="button" class="secondary" data-addlink="${f.path}" data-target="${id}" style="width:100%;margin-top:6px">+ Добавить ссылку</button>${sub}</div>`;
    case 'lines': // список простых строк (chat_id получателей)
      return `<div class="field"><label>${f.label}</label><div id="${id}" data-lines="${f.path}"></div>
        <button type="button" class="secondary" data-addline="${f.path}" data-target="${id}" style="width:100%;margin-top:6px">+ Добавить получателя</button>${sub}</div>`;
    default:
      return `<div class="field"><label>${f.label}</label>
        <input type="text" id="${id}" data-path="${f.path}" data-kind="text" value="${esc(v||'')}" placeholder="${f.ph||''}" ${f.maxlength?`maxlength="${f.maxlength}"`:''}>${sub}</div>`;
  }
}

function renderCard(c){
  return `<div class="card">
    <h2>${c.title}</h2>
    ${c.hint ? `<div class="hint">${c.hint}</div>` : ''}
    ${(c.fields||[]).map(renderField).join('')}
    ${c.html || ''}
  </div>`;
}

function renderPanel(panelId, cards){
  $(panelId).innerHTML = cards.map(renderCard).join('');
  bindPanel($(panelId));
}

// Одна общая привязка на панель — никаких индивидуальных onchange по всему файлу.
function bindPanel(root){
  root.querySelectorAll('[data-path]').forEach(el => {
    const path = el.dataset.path, kind = el.dataset.kind;
    if(kind === 'switch'){
      el.onclick = () => { el.classList.toggle('on'); setPath(settings, path, el.classList.contains('on')); afterChange(path); };
      return;
    }
    const handler = () => {
      let val = el.value;
      if(kind === 'num' || kind === 'range') val = val === '' ? null : Number(val);
      setPath(settings, path, val);
      if(kind === 'range'){ const b = document.getElementById(el.id + '_v'); if(b) b.textContent = val; }
      afterChange(path);
    };
    el.oninput = handler;
    if(el.tagName === 'SELECT') el.onchange = handler;
  });
  root.querySelectorAll('[data-tags]').forEach(box => renderTags(box, box.dataset.tags));
  root.querySelectorAll('[data-links]').forEach(box => renderLinks(box, box.dataset.links));
  root.querySelectorAll('[data-lines]').forEach(box => renderLines(box, box.dataset.lines));
  root.querySelectorAll('[data-addtag]').forEach(btn => btn.onclick = () => addTagInline(btn.dataset.addtag, btn.dataset.target));
  root.querySelectorAll('[data-addlink]').forEach(btn => btn.onclick = () => {
    const arr = getPath(settings, btn.dataset.addlink) || [];
    arr.push({ label:'', url:'' }); setPath(settings, btn.dataset.addlink, arr);
    renderLinks($(btn.dataset.target), btn.dataset.addlink);
  });
  root.querySelectorAll('[data-addline]').forEach(btn => btn.onclick = () => {
    const arr = getPath(settings, btn.dataset.addline) || [];
    arr.push(''); setPath(settings, btn.dataset.addline, arr);
    renderLines($(btn.dataset.target), btn.dataset.addline);
  });
}

// смена темы должна сразу отражаться в живом превью витрины. САМА админка
// темой магазина больше не перекрашивается — у неё собственные темы (см.
// ADMIN_THEMES), иначе светлый пресет витрины делал админку нечитаемой.
function afterChange(path){
  if(path.startsWith('theme.')) refreshPreview();
  if(path === 'theme.colorScheme'){
    const sw = $('schemeWarn');
    if(sw) sw.style.display = settings.theme.colorScheme === 'telegram' ? '' : 'none';
  }
  if(path === 'brand.shopName') $('shopTitle').textContent = settings.brand.shopName || 'Магазин';
  // у каждого мерчанта свой набор ключей — перерисовываем форму под выбранного
  if(path === 'payments.provider') buildPayments();
}

function renderTags(box, path){
  const arr = getPath(settings, path) || [];
  box.innerHTML = `<div class="tag-list">${arr.map((t,i)=>`<div class="tag">${esc(t)}<button type="button" data-i="${i}">×</button></div>`).join('')}</div>`;
  box.querySelectorAll('button').forEach(btn => btn.onclick = () => {
    arr.splice(Number(btn.dataset.i),1); setPath(settings, path, arr); renderTags(box, path);
  });
}

// вместо prompt(): во встроенных браузерах нативные диалоги часто блокируются молча
function addTagInline(path, targetId){
  const box = $(targetId);
  if(box.querySelector('.tag-input-row')) return;
  const row = document.createElement('div');
  row.className = 'tag-input-row';
  row.innerHTML = `<input type="text" placeholder="Введите значение"><button type="button">✓</button>`;
  box.appendChild(row);
  const input = row.querySelector('input');
  input.focus();
  const commit = () => {
    const v = input.value.trim();
    const arr = getPath(settings, path) || [];
    if(v){ arr.push(v); setPath(settings, path, arr); }
    renderTags(box, path);
  };
  row.querySelector('button').onclick = commit;
  input.onkeydown = e => { if(e.key==='Enter') commit(); if(e.key==='Escape') renderTags(box, path); };
}

function renderLinks(box, path){
  const arr = getPath(settings, path) || [];
  box.innerHTML = arr.map((l,i)=>`
    <div class="rowitem">
      <input class="narrow" placeholder="Подпись" value="${esc(l.label||'')}" data-i="${i}" data-f="label">
      <input placeholder="@username или https://..." value="${esc(l.url||'')}" data-i="${i}" data-f="url">
      <button type="button" class="row-remove" data-rm="${i}">${TRASH_SVG}</button>
    </div>`).join('');
  box.querySelectorAll('input').forEach(inp => inp.oninput = () => {
    arr[inp.dataset.i][inp.dataset.f] = inp.value; setPath(settings, path, arr);
  });
  box.querySelectorAll('[data-rm]').forEach(btn => btn.onclick = () => {
    arr.splice(Number(btn.dataset.rm),1); setPath(settings, path, arr); renderLinks(box, path);
  });
}

function renderLines(box, path){
  const arr = getPath(settings, path) || [];
  box.innerHTML = arr.map((v,i)=>`
    <div class="rowitem">
      <input placeholder="123456789 или @group" value="${esc(v)}" data-i="${i}">
      <button type="button" class="row-remove" data-rm="${i}">${TRASH_SVG}</button>
    </div>`).join('');
  box.querySelectorAll('input').forEach(inp => inp.oninput = () => { arr[inp.dataset.i] = inp.value; setPath(settings, path, arr); });
  box.querySelectorAll('[data-rm]').forEach(btn => btn.onclick = () => {
    arr.splice(Number(btn.dataset.rm),1); setPath(settings, path, arr); renderLines(box, path);
  });
}

const TABS = [
  ['dashboard','Обзор'], ['brand','Бренд'], ['theme','Тема'], ['catalog','Каталог'],
  ['commerce','Продажи'], ['checkout','Форма заказа'], ['payments','Оплата'], ['promo','Промокоды'], ['notify','Уведомления'],
  ['bot','Бот'], ['channel','Канал'], ['products','Товары'], ['orders','Заказы'], ['advanced','Ещё'],
];
let activeTab = 'dashboard';

function renderTabs(){
  $('tabs').innerHTML = TABS.map(([id,label]) =>
    `<div class="tab ${id===activeTab?'active':''}" data-tab="${id}">${label}</div>`).join('');
  $('tabs').querySelectorAll('.tab').forEach(el => el.onclick = () => selectTab(el.dataset.tab));
}
function selectTab(id){
  activeTab = id;
  renderTabs();
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  $('panel-' + id).classList.add('active');
  $('previewHost').style.display = id === 'theme' ? '' : 'none';
  window.scrollTo(0,0);
  buildPanel(id);
}

function buildPanel(id){
  if(id === 'dashboard') return buildDashboard();
  if(id === 'products')  return buildProducts();
  if(id === 'orders')    return buildOrders();
  if(id === 'brand'){
    renderPanel('panel-brand', PANEL_BRAND());
    renderLogoPreview();
    renderMarkGrid();
    $('logoInput').onchange = onLogoSelected;
    $('logoClear').onclick = () => {
      settings.brand.logoImage = '';
      markDirty(); renderLogoPreview(); refreshPreview();
    };
    return;
  }
  if(id === 'theme')     return buildTheme();
  if(id === 'catalog')   return renderPanel('panel-catalog', PANEL_CATALOG());
  if(id === 'commerce')  return renderPanel('panel-commerce', PANEL_COMMERCE());
  if(id === 'checkout')  return renderPanel('panel-checkout', PANEL_CHECKOUT());
  if(id === 'payments')  return buildPayments();
  if(id === 'promo')     return buildPromo();
  if(id === 'notify')    return buildNotify();
  if(id === 'bot')       return renderPanel('panel-bot', PANEL_BOT());
  if(id === 'channel')   return renderPanel('panel-channel', PANEL_CHANNEL());
  if(id === 'advanced')  return buildAdvanced();
}

// Превью — это настоящая витрина в iframe. Вместо перезагрузки при каждом
// движении ползунка отдаём ей тему сообщением: она применяет её мгновенно
// и без мигания. Так превью физически не может разойтись с реальностью.
let previewSent = '';   // что мы отправили последним
let previewAcked = '';  // что превью реально применило и подтвердило

function pushPreview(force){
  const frame = document.getElementById('previewFrame');
  if(!frame || !frame.contentWindow || !settings) return;
  const snapshot = JSON.stringify(settings);
  if(!force && snapshot === previewSent && snapshot === previewAcked) return;
  previewSent = snapshot;
  try{
    // отправляем разобранную копию: так в превью гарантированно уезжает
    // состояние на момент вызова, а не общая ссылка на изменяемый объект
    frame.contentWindow.postMessage(
      { type: 'shop-preview-settings', settings: JSON.parse(snapshot) }, location.origin);
  }catch(e){ previewSent = ''; /* iframe ещё грузится — досыл сделает сторож ниже */ }
}
const refreshPreview = debounce(() => pushPreview(false), 120);

// Сторож: раз в 400 мс сверяет, что превью подтвердило именно текущее состояние.
// Событийной отправки мало — сообщение может уйти, пока iframe перезагружается,
// или прийти раньше, чем витрина повесит обработчик. Здесь схема самолечится:
// пока подтверждение не совпадает с настройками, отправка повторяется.
setInterval(() => {
  if(activeTab !== 'theme' || !settings) return;
  if(previewAcked !== JSON.stringify(settings)) pushPreview(true);
}, 400);

window.addEventListener('message', e => {
  if(e.origin !== location.origin) return;
  if(!e.data) return;
  // витрина загрузилась и готова принимать настройки
  if(e.data.type === 'shop-preview-ready'){ previewAcked = ''; pushPreview(true); }
  // витрина подтвердила, что применила присланное состояние
  if(e.data.type === 'shop-preview-applied') previewAcked = e.data.applied || '';
});

      <div class="hint" style="margin-top:12px">

function renderPromoList(){
  const box = $('promoList');
  const codes = settings.promo.codes || [];
  if(!codes.length){ box.innerHTML = '<div class="empty">Кодов пока нет</div>'; return; }
  box.innerHTML = codes.map((c,i)=>`
    <div class="promo-item ${c.active?'':'off'}">
      <div class="row2">
        <div class="field" style="flex:2">
          <label>Код</label>
          <input data-p="${i}" data-f="code" value="${esc(c.code)}" placeholder="SALE20" style="text-transform:uppercase">
        </div>
        <div class="field">
          <label>Тип</label>
          <select data-p="${i}" data-f="type">
            <option value="percent" ${c.type==='percent'?'selected':''}>Процент</option>
            <option value="fixed" ${c.type==='fixed'?'selected':''}>Сумма</option>
          </select>
        </div>
        <div class="field">
          <label>${c.type==='percent'?'Скидка, %':'Скидка'}</label>
          <input type="number" min="0" data-p="${i}" data-f="value" value="${c.value}">
        </div>
      </div>
      <div class="row2">
        <div class="field">
          <label>Заказ от</label>
          <input type="number" min="0" data-p="${i}" data-f="minTotal" value="${c.minTotal}" placeholder="0 — без ограничения">
        </div>
        <div class="field">
          <label>Осталось применений</label>
          <input type="number" min="0" data-p="${i}" data-f="usesLeft" value="${c.usesLeft ?? ''}" placeholder="без ограничения">
        </div>
        <div class="field" style="flex:0 0 auto;display:flex;align-items:flex-end;gap:6px">
          <button type="button" class="icon-toggle ${c.active?'on':''}" data-toggle="${i}" title="${c.active?'Выключить':'Включить'}">${c.active?'✓':'○'}</button>
          <button type="button" class="row-remove" data-del="${i}" title="Удалить">${TRASH_SVG}</button>
        </div>
      </div>
      <div class="promo-used">Использован раз: ${c.used || 0}${c.usesLeft===null?'':` · осталось ${c.usesLeft}`}</div>
    </div>`).join('');

  box.querySelectorAll('[data-p]').forEach(el => {
    el.oninput = el.onchange = () => {
      const c = settings.promo.codes[Number(el.dataset.p)];
      const f = el.dataset.f;
      if(f === 'usesLeft') c[f] = el.value === '' ? null : Math.max(0, Number(el.value) || 0);
      else if(f === 'value' || f === 'minTotal') c[f] = Math.max(0, Number(el.value) || 0);
      else if(f === 'code') c[f] = el.value.toUpperCase();
      else c[f] = el.value;
      markDirty();
      if(f === 'type') renderPromoList(); // меняется подпись поля скидки
    };
  });
  box.querySelectorAll('[data-toggle]').forEach(b => b.onclick = () => {
    const c = settings.promo.codes[Number(b.dataset.toggle)];
    c.active = !c.active; markDirty(); renderPromoList();
  });
  box.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
    const c = settings.promo.codes[Number(b.dataset.del)];
    if(c.code && !await confirmDialog(`Удалить промокод ${c.code}?`)) return;
    settings.promo.codes.splice(Number(b.dataset.del), 1);
    markDirty(); buildPromo();
  });
}

let vpsTimer = 0;
async function loadVpsStatus(){
  const box = $('vpsStatus');
  if(!box) return;
  let d;
  try{ d = await api('/api/admin/system'); }
  catch(e){ box.innerHTML = `<div class="empty">Сервер не ответил: ${esc(e.message)}</div>`; return; }

  const gb = n => (n / 1073741824).toFixed(1) + ' ГБ';
  const mb = n => Math.round(n / 1048576) + ' МБ';
  const pct = (u, t) => t ? Math.round(u / t * 100) + '%' : '—';
  const up = s => {
    const days = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
    return (days ? days + ' д ' : '') + h + ' ч ' + m + ' м';
  };

  const rows = [
    ['Аптайм VPS', up(d.hostUptime)],
    ['CPU', `${d.cpu}% из ${d.cores} ядер · load ${d.load[0]}`],
    ['ОЗУ', `${gb(d.mem.used)} из ${gb(d.mem.total)} (${pct(d.mem.used, d.mem.total)})`],
  ];
  if(d.disk) rows.push(['Диск', `${gb(d.disk.used)} из ${gb(d.disk.total)} (${pct(d.disk.used, d.disk.total)})`]);
  rows.push(['GPU', d.gpu
    ? `${esc(d.gpu.name)} · ${d.gpu.util}% · ${mb(d.gpu.memUsed)}/${mb(d.gpu.memTotal)} · ${d.gpu.temp}°C`
    : 'не обнаружена']);
  rows.push(['Процесс магазина', `${up(d.processUptime)} · ${mb(d.rss)} ОЗУ`]);

  box.innerHTML = rows.map(([k, v]) =>
    `<div class="vps-row"><span class="k">${k}</span><b>${v}</b></div>`).join('');
}

let pendingImages = [];
let pendingThumbs = [];
let editingId = null;

function buildProducts(){

function renderPhotoGrid(){
  const grid = $('photoGrid');
  const slots = [];
  for(let i = 0; i < 8; i++){
    const imgId = pendingImages[i];
    const thumbId = pendingThumbs[i] || imgId;
    if(imgId){
      slots.push(`<div class="photo-slot filled"><img src="/api/image?id=${encodeURIComponent(thumbId)}">
        ${i === 0 ? '<span class="photo-main-tag">Главное</span>' : ''}
        <button type="button" class="photo-remove" data-remove="${i}">×</button></div>`);
    } else if(i === pendingImages.length){
      slots.push(`<label class="photo-slot">${PLACEHOLDER_SVG}<input type="file" accept="image/*" data-upload="${i}"></label>`);
    } else {
      slots.push(`<div class="photo-slot" style="opacity:.3;cursor:default">${PLACEHOLDER_SVG}</div>`);
    }
  }
  grid.innerHTML = slots.join('');
  grid.querySelectorAll('[data-upload]').forEach(input => {
    input.onchange = e => onPhotoSelected(e, Number(input.dataset.upload));
  });
  grid.querySelectorAll('[data-remove]').forEach(btn => {
    btn.onclick = e => {
      e.preventDefault();
      const i = Number(btn.dataset.remove);
      pendingImages.splice(i, 1); pendingThumbs.splice(i, 1);
      renderPhotoGrid();
    };
  });
}

function loadImageEl(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = () => { const img = new Image(); img.onerror = reject; img.onload = () => resolve(img); img.src = reader.result; };
    reader.readAsDataURL(file);
  });
}
function resizeToDataUrl(img, maxW, quality){
  const scale = Math.min(1, maxW / img.width);
  const canvas = document.createElement('canvas');
  canvas.width = Math.round(img.width * scale);
  canvas.height = Math.round(img.height * scale);
  canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
  // WebP при том же качестве весит на 25-35% меньше JPEG — на глаз разницы нет
  return canvas.toDataURL('image/webp', quality);
}
// Две версии из одного файла: миниатюра для сетки, «полная» — для карусели.
// 1200px было избыточно: карусель занимает ширину экрана телефона (360–430 CSS-px),
// то есть даже на 3x-экране хватает 900px. Лишние 300px давали +40% к весу файла
// без единого видимого пикселя разницы. Качество 0.78 для WebP на фото
// неотличимо от 0.82 на глаз, но заметно легче.
async function resizeImage(file){
  const img = await loadImageEl(file);
  return { full: resizeToDataUrl(img, 900, 0.78), thumb: resizeToDataUrl(img, 400, 0.7) };
}

async function onPhotoSelected(e, slotIndex){
  const file = e.target.files[0];
  if(!file) return;
  try{
    const { full, thumb } = await resizeImage(file);
    const [fullRes, thumbRes] = await Promise.all([
      api('/api/admin/upload', { method:'POST', body: JSON.stringify({ dataUrl: full }) }),
      api('/api/admin/upload', { method:'POST', body: JSON.stringify({ dataUrl: thumb }) }),
    ]);
    pendingImages[slotIndex] = fullRes.id;
    pendingThumbs[slotIndex] = thumbRes.id;
  }catch(err){ toast('Не удалось загрузить фото: ' + err.message, true); }
  renderPhotoGrid();
}

async function saveProduct(){
  const val = id => $(id).value.trim();
  const name = val('pName');
  const price = Number(val('pPrice'));
  if(!name){ toast('Укажите название товара', true); $('pName').focus(); return; }
  if(!price && !settings.commerce.priceHidden){ toast('Укажите цену', true); $('pPrice').focus(); return; }

  const payload = {
    name, price,
    category: val('pCategory'),
    description: val('pDesc'),
    oldPrice: val('pOldPrice') === '' ? null : Number(val('pOldPrice')),
    stock: val('pStock') === '' ? null : Math.max(0, Number(val('pStock')) || 0),
    badge: val('pBadge'),
    images: pendingImages, thumbs: pendingThumbs,
  };

  try{
    if(editingId){
      const updated = await api('/api/admin/products', { method:'PUT', body: JSON.stringify({ ...payload, id: editingId }) });
      products = products.map(p => p.id === editingId ? updated : p);
      toast('Товар обновлён');
    } else {
      products.push(await api('/api/admin/products', { method:'POST', body: JSON.stringify(payload) }));
      toast('Товар добавлен');
    }
  }catch(e){ toast('Не удалось сохранить товар: ' + e.message, true); return; }

  resetProductForm();
  updateCategoryList();
  renderList();
}

function resetProductForm(){
  editingId = null;
  ['pName','pCategory','pDesc','pPrice','pOldPrice','pStock','pBadge'].forEach(id => { if($(id)) $(id).value = ''; });
  pendingImages = []; pendingThumbs = [];
  renderPhotoGrid();
  $('prodFormTitle').textContent = 'Добавить товар';
  $('saveProductBtn').textContent = 'Добавить товар';
  $('cancelEditBtn').style.display = 'none';
}

function editProduct(id){
  const p = products.find(x => x.id === id);
  if(!p) return;
  editingId = id;
  $('pName').value = p.name || '';
  $('pCategory').value = p.category || '';
  $('pDesc').value = p.description || '';
  $('pPrice').value = p.price ?? '';
  $('pOldPrice').value = p.oldPrice ?? '';
  $('pStock').value = typeof p.stock === 'number' ? p.stock : '';
  $('pBadge').value = p.badge || '';
  pendingImages = [...(p.images || [])];
  pendingThumbs = [...(p.thumbs || [])];
  renderPhotoGrid();
  $('prodFormTitle').textContent = 'Редактирование: ' + p.name;
  $('saveProductBtn').textContent = 'Сохранить изменения';
  $('cancelEditBtn').style.display = '';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function updateCategoryList(){
  const cats = [...new Set(products.map(p => p.category).filter(Boolean))];
  const dl = $('categoryList');
  if(dl) dl.innerHTML = cats.map(c => `<option value="${esc(c)}">`).join('');
}

let productFilter = '';

function renderList(){
  const list = $('list');
  if(!list) return;
  if(!products.length){ list.innerHTML = '<div class="empty">Товаров пока нет.<br>Добавьте первый в форме выше.</div>'; return; }

  // Фильтр только показывает подмножество — порядок и стрелки перемещения
  // по-прежнему считаются от полного списка, иначе «выше» двигало бы не туда.
  const visible = productFilter
    ? products.filter(p => (p.name + ' ' + (p.category || '')).toLowerCase().includes(productFilter))
    : products;

  if(!visible.length){
    list.innerHTML = `<div class="empty">Ничего не найдено по запросу «${esc(productFilter)}»</div>`;
    return;
  }

  list.innerHTML = visible.map(p => { const i = products.indexOf(p); return `
    <div class="row ${p.hidden ? 'hidden-prod' : ''}">
      <div class="thumb">${(p.thumbs && p.thumbs[0]) || (p.images && p.images[0])
        ? `<img src="/api/image?id=${encodeURIComponent((p.thumbs && p.thumbs[0]) || p.images[0])}">` : PLACEHOLDER_SVG}</div>
      <div class="info">
        <div class="name">${esc(p.name)}</div>
        <div class="meta">
          <span class="price">${fmt(p.price)}</span>
          ${p.category ? `<span class="category">${esc(p.category)}</span>` : ''}
          <span class="category" data-act="stock" data-id="${p.id}" style="cursor:pointer">
            ${p.stock === 0 ? 'Раскуплено' : typeof p.stock === 'number' ? `Остаток: ${p.stock}` : 'Не ограничено'}
          </span>
          ${views[p.id] ? `<span class="views-count">${EYE_SVG}${views[p.id]}</span>` : ''}
        </div>
      </div>
      <div class="actions">
        <button class="icon-toggle" data-id="${p.id}" data-act="up" title="Поднять выше" ${i===0?'disabled':''}>↑</button>
        <button class="icon-toggle" data-id="${p.id}" data-act="down" title="Опустить ниже" ${i===products.length-1?'disabled':''}>↓</button>
        <button class="icon-toggle ${p.featured ? 'on' : ''}" data-id="${p.id}" data-act="star" title="Пометить как хит">${STAR_SVG}</button>
        <button class="icon-toggle" data-id="${p.id}" data-act="edit" title="Изменить">${EDIT_SVG}</button>
        <button class="icon-toggle ${p.hidden ? 'on' : ''}" data-id="${p.id}" data-act="hide" title="${p.hidden ? 'Вернуть на витрину' : 'Убрать с витрины'}">${EYE_OFF_SVG}</button>
        <button class="icon-toggle" data-id="${p.id}" data-act="publish" title="Опубликовать в канал" style="color:var(--accent-2)">${SEND_SVG}</button>
        <button class="icon-toggle" data-id="${p.id}" data-act="delete" title="Удалить" style="color:var(--danger)">${TRASH_SVG}</button>
      </div>
    </div>`; }).join('');

  const on = (act, fn) => list.querySelectorAll(`[data-act=${act}]`).forEach(el => el.onclick = () => fn(Number(el.dataset.id), el));
  on('stock', editStock);
  on('star',  id => patchProduct(id, { featured: !products.find(p=>p.id===id).featured }));
  on('hide',  id => patchProduct(id, { hidden: !products.find(p=>p.id===id).hidden }));
  on('edit',  editProduct);
  on('publish', publishProduct);
  on('delete', removeProduct);
  on('up', id => moveProduct(id, -1));
  on('down', id => moveProduct(id, +1));
}

async function moveProduct(id, delta){
  const i = products.findIndex(p => p.id === id);
  const j = i + delta;
  if(i === -1 || j < 0 || j >= products.length) return;
  [products[i], products[j]] = [products[j], products[i]];
  renderList();
  try{
    await api('/api/admin/reorder', { method:'POST', body: JSON.stringify({ ids: products.map(p=>p.id) }) });
  }catch(e){
    toast('Порядок не сохранился: ' + e.message, true);
  }
}

async function patchProduct(id, patch){
  const p = products.find(x => x.id === id);
  Object.assign(p, patch);
  renderList();
  try{ await api('/api/admin/products', { method:'PUT', body: JSON.stringify({ id, ...patch }) }); }
  catch(e){ toast('Не сохранилось: ' + e.message, true); }
}

async function publishProduct(id, btn){
  btn.disabled = true;
  const original = btn.innerHTML;
  btn.innerHTML = '…';
  try{
    await api('/api/admin/publish', { method:'POST', body: JSON.stringify({ productId: id }) });
    btn.innerHTML = '✓';
    setTimeout(() => { btn.innerHTML = original; btn.disabled = false; }, 1400);
    return;
  }catch(e){ toast('Не удалось опубликовать: ' + e.message, true); }
  btn.innerHTML = original;
  btn.disabled = false;
}

function editStock(id){
  const el = document.querySelector(`[data-act="stock"][data-id="${id}"]`);
  if(!el || el.querySelector('input')) return;
  const p = products.find(x => x.id === id);
  el.innerHTML = `<input type="number" min="0" value="${typeof p.stock === 'number' ? p.stock : ''}" placeholder="—" style="width:64px;padding:2px 5px">`;
  const input = el.querySelector('input');
  input.focus();
  input.onclick = e => e.stopPropagation();
  const commit = async () => {
    const stock = input.value.trim() === '' ? null : Math.max(0, Number(input.value) || 0);
    await patchProduct(id, { stock });
  };
  input.onblur = commit;
  input.onkeydown = e => { if(e.key === 'Enter') input.blur(); };
}

async function removeProduct(id){
  if(!await confirmDialog('Удалить товар? Фотографии тоже будут стёрты с сервера.')) return;
  await api('/api/admin/products?id=' + id, { method:'DELETE' });
  products = products.filter(x => x.id !== id);
  updateCategoryList();
  renderList();
}

/* ==================== СОХРАНЕНИЕ ==================== */
async function saveSettings(){
  const btn = $('saveBtn');
  btn.disabled = true;
  try{
    settings = await api('/api/admin/settings', { method:'PUT', body: JSON.stringify(settings) });
    dirty = false;
    $('saveStatus').textContent = 'Сохранено ✓';
    setTimeout(() => { $('savebar').classList.remove('show'); }, 1200);
  }catch(e){ toast('Не удалось сохранить: ' + e.message, true); }
  btn.disabled = false;
}

async function onLogoSelected(e){
  const file = e.target.files[0];
  if(!file) return;
  const preview = $('logoPreview');
  preview.innerHTML = '…';
  try{
    const { thumb } = await resizeImage(file);
    const res = await api('/api/admin/upload', { method:'POST', body: JSON.stringify({ dataUrl: thumb }) });
    settings.brand.logoImage = res.id;
    markDirty();
    preview.innerHTML = `<img src="${thumb}">`;
    refreshPreview();
  }catch(err){
    toast('Не удалось загрузить логотип: ' + err.message, true);
    preview.innerHTML = PLACEHOLDER_SVG;
  }
}

/* ==================== СТАРТ ==================== */
async function init(){
  try{
    [settings, products] = await Promise.all([
      api('/api/admin/settings'),
      api('/api/admin/products'),
    ]);
  }catch(e){
    $('loginErr').textContent = e.message === 'unauthorized' ? 'Неверный токен' : e.message;
    return false;
  }
  try{ views = await api('/api/admin/views'); }catch(e){ views = {}; }
  try{ stats = await api('/api/admin/stats'); }catch(e){ stats = {}; }

  $('loginBox').style.display = 'none';
  $('wrap').classList.add('open');
  $('shopTitle').textContent = settings.brand.shopName || 'Магазин';
  $('botStatus').textContent = stats.botConnected ? 'бот подключён' : 'бот не подключён';
  $('botStatus').style.color = stats.botConnected ? 'var(--accent-2)' : 'var(--danger)';

  // тему витрины здесь НЕ применяем: за неё отвечает живое превью, а админка
  // рисуется собственной темой (applyAdminTheme при загрузке страницы)
  setCurrency({ symbol: settings.commerce.currency, position: settings.commerce.currencyPosition, locale: settings.advanced.locale });

  renderTabs();
  selectTab(activeTab);
  return true;
}

$('loginBtn').onclick = async () => {
  TOKEN = $('tokenInput').value.trim();
  if(!TOKEN) return;
  $('loginErr').textContent = '';
  const ok = await init();
  // токен держим только в sessionStorage: закрыл вкладку — вход слетел
  if(ok) try{ sessionStorage.setItem('admin_token', TOKEN); }catch(e){}
};
$('tokenInput').onkeydown = e => { if(e.key === 'Enter') $('loginBtn').click(); };
$('saveBtn').onclick = saveSettings;
$('previewReload').onclick = () => { $('previewFrame').contentWindow.location.reload(); };

// автологин в пределах сессии, чтобы не вводить токен после каждого обновления
try{
  const saved = sessionStorage.getItem('admin_token');
  if(saved){ TOKEN = saved; init(); }
}catch(e){}

// не терять несохранённые настройки при случайном закрытии
window.addEventListener('beforeunload', e => { if(dirty){ e.preventDefault(); e.returnValue = ''; } });
</script>
